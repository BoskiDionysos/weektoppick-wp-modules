name: 02a_server_snapshot (read-only, server state, enriched)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: server-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST:   ${{ secrets.DEPLOY_HOST }}
      PORT:   ${{ secrets.DEPLOY_PORT }}
      USER:   ${{ secrets.DEPLOY_USER }}
      PASS:   ${{ secrets.DEPLOY_PASS }}
      TARGET: ${{ secrets.DEPLOY_TARGET }}
      RUN_ID: ${{ github.run_id }}
      LATEST: .wtp/state/ro/public/latest/server
      OUTDIR: .wtp/state/ro/public/${{ github.run_id }}/server
      WTP_CI: "1" # dla MU-locków po stronie WP

    steps:
      - uses: actions/checkout@v4

      - name: Sanity (secrets + dirs)
        run: |
          set -euo pipefail
          for v in HOST PORT USER PASS TARGET; do
            [ -n "${!v:-}" ] || { echo "::error::Missing secret $v"; exit 1; }
          done
          mkdir -p "_ci_logs/${RUN_ID}/server" "${OUTDIR}" "${LATEST}"

      - name: Setup tools (sshpass)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "::add-mask::$HOST"
          echo "::add-mask::$USER"

      - name: Remote: wp core/theme/plugin/options + sanity
        run: |
          set -euo pipefail
          # surowe artefakty -> _ci_logs
          sshpass -p "$PASS" ssh -p "$PORT" \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$USER@$HOST" "set -euo pipefail; cd '$TARGET' && \
              echo \$(which php) > php_which.txt && \
              php -v > php_version.txt 2>&1 && \
              uname -a > uname.txt && \
              pwd > pwd.txt && \
              php ./wp --info > wp_core.txt 2>&1 || true && \
              php ./wp core version --extra --format=json > core.json 2>/dev/null || php ./wp core version > core.json.txt || true && \
              php ./wp theme list --format=json > themes.json 2>/dev/null || php ./wp theme list > themes.txt || true && \
              php ./wp plugin list --format=json > plugins.json 2>/dev/null || php ./wp plugin list > plugins.txt || true && \
              php ./wp option get active_plugins --format=json > active_plugins.json 2>/dev/null || php ./wp option get active_plugins > active_plugins.txt || true && \
              php ./wp option get permalink_structure > permalink.txt 2>/dev/null || true && \
              php ./wp option get siteurl > siteurl.txt 2>/dev/null || true && \
              php ./wp option get home > home.txt 2>/dev/null || true && \
              php ./wp option get blogdescription > blogdescription.txt 2>/dev/null || true && \
              php ./wp eval 'echo get_locale();' > locale.txt 2>/dev/null || true && \
              php ./wp eval 'echo is_multisite()?\"1\":\"0\";' > is_ms.txt 2>/dev/null || true && \
              mkdir -p .wtp/state/ci_logs && \
              mv php_which.txt php_version.txt uname.txt pwd.txt wp_core.txt core.json* themes.* plugins.* active_plugins.* permalink.txt siteurl.txt home.txt blogdescription.txt locale.txt is_ms.txt .wtp/state/ci_logs/"

          # Pobierz do _ci_logs
          sshpass -p "$PASS" scp -P "$PORT" -r \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$USER@$HOST:$TARGET/.wtp/state/ci_logs/*" "_ci_logs/${RUN_ID}/server/"

      - name: Build snapshot.json + SERVER_SNAPSHOT.md
        run: |
          set -euo pipefail
          python - << 'PY'
          import json, os, pathlib
          rid = os.environ["RUN_ID"]
          ci = pathlib.Path(f"_ci_logs/{rid}/server")
          outdir = pathlib.Path(os.environ["OUTDIR"])
          latest = pathlib.Path(os.environ["LATEST"])
          outdir.mkdir(parents=True, exist_ok=True)
          latest.mkdir(parents=True, exist_ok=True)

          def rd(p):
              p=ci/p
              if not p.exists(): return None
              try: return p.read_text(encoding="utf-8").strip()
              except Exception: return None

          def rj(p):
              p=ci/p
              if not p.exists(): return None
              try: return json.loads(p.read_text(encoding="utf-8"))
              except Exception: return None

          data = {
            "php": {
              "which": rd("php_which.txt"),
              "version": rd("php_version.txt")
            },
            "uname": rd("uname.txt"),
            "pwd": rd("pwd.txt"),
            "wp": {
              "wp_cli_info": rd("wp_core.txt"),
              "core": rj("core.json") or rd("core.json.txt"),
              "themes": rj("themes.json") or rd("themes.txt"),
              "plugins": rj("plugins.json") or rd("plugins.txt"),
              "active_plugins": rj("active_plugins.json") or rd("active_plugins.txt"),
              "siteurl": rd("siteurl.txt"),
              "home": rd("home.txt"),
              "permalink_structure": rd("permalink.txt"),
              "blogdescription": rd("blogdescription.txt"),
              "locale": rd("locale.txt"),
              "is_multisite": rd("is_ms.txt") in ("1", "true", "True"),
            }
          }

          # Walidacja: brak aktywnego motywu albo brak listy wtyczek → error gate
          themes = data["wp"]["themes"]
          plugins = data["wp"]["plugins"]
          act = data["wp"]["active_plugins"]
          errors = []

          # themes.json w formacie listy lub tabeli; sprawdź aktywny
          active_theme = None
          if isinstance(themes, list):
              for t in themes:
                  if isinstance(t, dict) and (t.get("status") == "active" or t.get("Status") == "active"):
                      active_theme = t.get("name") or t.get("Name")
                      break
          elif isinstance(themes, str):
              # fallback text – zostaw puste
              pass

          if not active_theme:
              errors.append("No active theme detected (themes.json missing or did not mark an active theme).")

          if not plugins:
              errors.append("WP plugin list is empty or unreadable.")
          if act in (None, "", []):
              errors.append("WP option active_plugins is empty or unreadable.")

          # Zapis JSON + MD
          (outdir/"snapshot.json").write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")

          md = []
          md.append("# SERVER SNAPSHOT")
          md.append(f"- Run ID: {rid}")
          md.append("")
          md.append("## PHP / System")
          md.append(f"- which php: `{data['php']['which']}`")
          md.append(f"- php -v: ```\n{data['php']['version']}\n```")
          md.append(f"- uname: `{data['uname']}`")
          md.append(f"- pwd: `{data['pwd']}`")
          md.append("")
          md.append("## WordPress")
          md.append(f"- siteurl: `{data['wp']['siteurl']}`")
          md.append(f"- home: `{data['wp']['home']}`")
          md.append(f"- permalink_structure: `{data['wp']['permalink_structure']}`")
          md.append(f"- locale: `{data['wp']['locale']}` • multisite: `{data['wp']['is_multisite']}`")
          md.append("")
          md.append("### Themes (raw)")
          md.append("```")
          md.append(json.dumps(themes, ensure_ascii=False, indent=2) if themes is not None else "null")
          md.append("```")
          md.append("")
          md.append("### Plugins (raw)")
          md.append("```")
          md.append(json.dumps(plugins, ensure_ascii=False, indent=2) if plugins is not None else "null")
          md.append("```")
          md.append("")
          md.append("### active_plugins (raw)")
          md.append("```")
          md.append(json.dumps(act, ensure_ascii=False, indent=2) if act is not None else "null")
          md.append("```")
          if errors:
              md.append("")
              md.append("## Errors")
              for e in errors: md.append(f"- {e}")
          (outdir/"SERVER_SNAPSHOT.md").write_text("\n".join(md)+"\n", encoding="utf-8")

          # mirror do latest (zawsze)
          for name in ("snapshot.json","SERVER_SNAPSHOT.md"):
              (latest/name).write_text((outdir/name).read_text(encoding="utf-8"), encoding="utf-8")

          # Zwrotka błędów do logu (kontrola w następnym kroku)
          if errors:
              (outdir/"_errors.txt").write_text("\n".join(errors), encoding="utf-8")
          PY

      - name: Fail on critical snapshot gaps (active theme / plugins)
        run: |
          set -euo pipefail
          ERR="${OUTDIR}/_errors.txt"
          if [ -s "$ERR" ]; then
            echo "::group::Server snapshot validation errors"
            cat "$ERR"
            echo "::endgroup::"
            echo "::error::Server snapshot incomplete (see errors above)."
            exit 1
          fi

      - name: Commit & push (rebase-safe)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::Nothing to commit."
            exit 0
          fi
          git commit -m "server snapshot $RUN_ID"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git branch --show-current >/dev/null 2>&1 || git checkout -B "$BRANCH"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git pull --rebase origin "$BRANCH" || { git rebase --continue || true; }
            if git push origin "HEAD:$BRANCH"; then
              echo "::notice::Pushed (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Push failed after 3 attempts"
          exit 1
