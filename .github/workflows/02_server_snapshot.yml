name: 02a_server_snapshot (server state + wp-options)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: server-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST:   ${{ secrets.DEPLOY_HOST }}
      PORT:   ${{ secrets.DEPLOY_PORT }}
      USER:   ${{ secrets.DEPLOY_USER }}
      PASS:   ${{ secrets.DEPLOY_PASS }}
      TARGET: ${{ secrets.DEPLOY_TARGET }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup tools
        run: |
          set -euo pipefail
          for v in HOST PORT USER PASS TARGET; do
            [ -n "${!v:-}" ] || { echo "::error::Missing $v"; exit 1; }
          done
          sudo apt-get update -y
          sudo apt-get install -y sshpass curl jq
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Create remote script (collect WP/OS + wp-options)
        run: |
          set -euo pipefail
          cat > /tmp/snap.sh <<'SCRIPT'
          set -euo pipefail
          cd "$TARGET"

          # Ensure ./wp exists (local copy)
          if [ ! -x ./wp ]; then
            curl -sS -L -o wp.phar https://github.com/wp-cli/wp-cli/releases/latest/download/wp-cli.phar
            php wp.phar --info >/dev/null 2>&1
            chmod +x wp.phar && mv wp.phar wp
          fi

          mkdir -p .wtp/state/tmp_snapshot

          # System basics
          uname -a > .wtp/state/tmp_snapshot/uname.txt || true
          which php > .wtp/state/tmp_snapshot/php_which.txt || true
          php -v    > .wtp/state/tmp_snapshot/php_version.txt || true
          pwd       > .wtp/state/tmp_snapshot/pwd.txt || true

          # WP/CLI basics
          ./wp --info > .wtp/state/tmp_snapshot/wp_cli_info.txt || true
          ./wp core version        > .wtp/state/tmp_snapshot/wp_core_version.txt || true
          ./wp core version --extra > .wtp/state/tmp_snapshot/wp_core_version_extra.txt || true

          # Structured lists
          ./wp plugin list --format=json      > .wtp/state/tmp_snapshot/plugins.json || echo "[]" > .wtp/state/tmp_snapshot/plugins.json
          ./wp theme list  --format=json      > .wtp/state/tmp_snapshot/themes.json  || echo "[]" > .wtp/state/tmp_snapshot/themes.json

          # Selected wp-options (rozszerzalne)
          # UWAGA: nie używamy --format=json na 'option get' (często zwraca serialize),
          # bierzemy raw i serializację parsujemy po stronie GHA (Python).
          OPT_DIR=".wtp/state/tmp_snapshot/options"
          mkdir -p "$OPT_DIR"

          get_opt () {
            key="$1"
            ./wp option get "$key" > "$OPT_DIR/${key}.raw.txt" 2>/dev/null || true
          }

          # Krytyczne opcje
          get_opt siteurl
          get_opt home
          get_opt permalink_structure
          get_opt timezone_string
          get_opt blogname
          get_opt blogdescription
          get_opt active_plugins
          get_opt template
          get_opt stylesheet
          get_opt rank-math-options
          get_opt rank-math-titles
          get_opt litespeed.conf
          get_opt litespeed.settings

          # Zrzut aktywnego motywu (fallback; część danych da też themes.json)
          ./wp theme status > .wtp/state/tmp_snapshot/theme_status.txt || true
          SCRIPT

      - name: Run remote script
        run: |
          set -euo pipefail
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=yes "$USER@$HOST" "TARGET='$TARGET' bash -s" < /tmp/snap.sh

      - name: Pull raw artifacts
        run: |
          set -euo pipefail
          mkdir -p "_ci_logs/${RUN_ID}/server"
          sshpass -p "$PASS" scp -P "$PORT" -r -o StrictHostKeyChecking=yes \
            "$USER@$HOST:$TARGET/.wtp/state/tmp_snapshot/*" "_ci_logs/${RUN_ID}/server/"

      - name: Assemble snapshot.json and SERVER_SNAPSHOT.md
        run: |
          set -euo pipefail
          python - << 'PY'
          import json, os, pathlib, re
          RUN_ID = os.environ["RUN_ID"]
          base = pathlib.Path(f"_ci_logs/{RUN_ID}/server")
          out_dir = pathlib.Path(f".wtp/state/ro/public/{RUN_ID}/server")
          latest = pathlib.Path(".wtp/state/ro/public/latest/server")
          out_dir.mkdir(parents=True, exist_ok=True); latest.mkdir(parents=True, exist_ok=True)

          def read(p):
            try: return pathlib.Path(p).read_text(encoding="utf-8", errors="ignore").strip()
            except: return ""

          def read_json(p):
            try: return json.loads(pathlib.Path(p).read_text(encoding="utf-8"))
            except: return []

          # Parse active_plugins option (serialized PHP) — prosty heurystyczny parser
          def parse_active_plugins(raw):
            # jeśli to JSON (rzadko), spróbujmy
            t = raw.strip()
            if t.startswith('[') or t.startswith('{'):
              try: return json.loads(t)
              except: pass
            # spróbuj wyłuskać wpisy 'plugin-dir/plugin.php'
            return re.findall(r"[A-Za-z0-9_\-\/]+\.php", t)

          # Build snapshot structure
          snapshot = {
            "run_id": RUN_ID,
            "system": {
              "uname": read(base/"uname.txt"),
              "php_which": read(base/"php_which.txt"),
              "php_version": read(base/"php_version.txt"),
              "pwd": read(base/"pwd.txt"),
            },
            "wp": {
              "cli_info": read(base/"wp_cli_info.txt"),
              "core_version": read(base/"wp_core_version.txt"),
              "core_version_extra": read(base/"wp_core_version_extra.txt"),
              "plugins": read_json(base/"plugins.json"),
              "themes":  read_json(base/"themes.json"),
              "theme_status": read(base/"theme_status.txt")
            },
            "options": {}
          }

          opt_dir = base/"options"
          if opt_dir.exists():
            for optf in opt_dir.glob("*.raw.txt"):
              key = optf.stem
              raw = read(optf)
              if key == "active_plugins":
                snapshot["options"][key] = parse_active_plugins(raw)
              else:
                snapshot["options"][key] = raw

          # Minimalna sanity walidacja
          if not snapshot["wp"]["plugins"]:
            print("::warning::WP plugins list is empty — verify WP path and permissions.")
          # Zapis JSON
          (out_dir/"snapshot.json").write_text(json.dumps(snapshot, ensure_ascii=False, indent=2), encoding="utf-8")
          (latest/"snapshot.json").write_text(json.dumps(snapshot, ensure_ascii=False, indent=2), encoding="utf-8")

          # Markdown summary
          md = []
          md.append("# SERVER SNAPSHOT")
          md.append(f"- Run ID: {RUN_ID}")
          md.append("")
          md.append("## System")
          md.append(f"- uname: `{snapshot['system']['uname']}`")
          md.append(f"- php: `{snapshot['system']['php_version']}`")
          md.append("")
          md.append("## WordPress")
          md.append(f"- core: `{snapshot['wp']['core_version']}`")
          md.append(f"- themes: {len(snapshot['wp']['themes'])}")
          md.append(f"- plugins: {len(snapshot['wp']['plugins'])}")
          md.append("")
          md.append("## Options (selected)")
          for k in ["siteurl","home","permalink_structure","timezone_string","blogname","blogdescription","template","stylesheet"]:
            v = snapshot["options"].get(k, "")
            if isinstance(v, list): v = ", ".join(v)
            md.append(f"- {k}: `{str(v)[:300]}`")
          ap = snapshot["options"].get("active_plugins", [])
          md.append(f"- active_plugins: {len(ap)} item(s)")
          md.append("")
          (out_dir/"SERVER_SNAPSHOT.md").write_text("\n".join(md)+"\n", encoding="utf-8")
          (latest/"SERVER_SNAPSHOT.md").write_text("\n".join(md)+"\n", encoding="utf-8")
          PY

      - name: Commit & push (rebase-safe)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::Nothing to commit."
            exit 0
          fi
          git commit -m "server snapshot $RUN_ID"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git branch --show-current >/dev/null 2>&1 || git checkout -B "$BRANCH"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git pull --rebase origin "$BRANCH" || { git rebase --continue || true; }
            if git push origin "HEAD:$BRANCH"; then
              echo "::notice::Pushed (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Push failed after 3 attempts"
          exit 1
