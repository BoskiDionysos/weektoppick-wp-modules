name: 02a_server_snapshot (server read-only snapshot + active_plugins_meta)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: server-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RUN_ID: ${{ github.run_id }}
      HOST:   ${{ secrets.DEPLOY_HOST }}
      PORT:   ${{ secrets.DEPLOY_PORT }}
      USER:   ${{ secrets.DEPLOY_USER }}
      PASS:   ${{ secrets.DEPLOY_PASS }}
      TARGET: ${{ secrets.DEPLOY_TARGET }}
      WTP_CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity secrets
        shell: bash
        run: |
          set -euo pipefail
          for v in HOST PORT USER PASS TARGET; do
            [ -n "${!v:-}" ] || { echo "::error::Missing secret/env $v"; exit 1; }
          done
          echo "::add-mask::$HOST"
          echo "::add-mask::$USER"
          echo "::add-mask::$PASS"
          echo "::add-mask::$TARGET"

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y sshpass jq rsync

      - name: Prepare local log dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "_ci_logs/${RUN_ID}/server" ".wtp/state/ro/public/${RUN_ID}/server"

      - name: Create remote gather script
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/remote_gather.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          # TARGET must be provided in environment when executing remotely
          cd "$TARGET" || exit 1

          # ensure WP-CLI (local in project) or download temporary wp.phar
          if ! command -v php >/dev/null 2>&1; then
            echo "::error::php CLI not available"; exit 1
          fi

          if [ ! -x ./wp ]; then
            curl -sS -L -o wp.phar https://github.com/wp-cli/wp-cli/releases/latest/download/wp-cli.phar
            php wp.phar --info >/dev/null 2>&1 || true
            chmod +x wp.phar && mv -f wp.phar wp || true
          fi

          mkdir -p .wtp/state/ci_logs

          uname -a > .wtp/state/ci_logs/uname.txt 2>&1 || true
          php -v  > .wtp/state/ci_logs/php_version.txt 2>&1 || true
          pwd     > .wtp/state/ci_logs/pwd.txt 2>&1 || true

          # gather WP info (non-sensitive)
          php ./wp core version --path="$TARGET" > .wtp/state/ci_logs/wp_version.txt 2>&1 || true
          php ./wp option get siteurl --path="$TARGET" > .wtp/state/ci_logs/siteurl.txt 2>&1 || true
          php ./wp theme list --format=json --path="$TARGET" > .wtp/state/ci_logs/themes.json 2>&1 || echo "[]" > .wtp/state/ci_logs/themes.json
          php ./wp plugin list --format=json --path="$TARGET" > .wtp/state/ci_logs/plugins.json 2>&1 || echo "[]" > .wtp/state/ci_logs/plugins.json
          php ./wp option get active_plugins --format=json --path="$TARGET" > .wtp/state/ci_logs/active_plugins.json 2>&1 || echo "[]" > .wtp/state/ci_logs/active_plugins.json
          php ./wp option get stylesheet --path="$TARGET" > .wtp/state/ci_logs/active_theme.txt 2>&1 || true

          # done
          SH
          chmod +x /tmp/remote_gather.sh

      - name: Run remote gather
        shell: bash
        run: |
          set -euo pipefail
          sshpass -p "$PASS" scp -P "$PORT" -o StrictHostKeyChecking=no /tmp/remote_gather.sh "$USER@$HOST:/tmp/remote_gather.sh"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no "$USER@$HOST" "export TARGET='$TARGET' && bash /tmp/remote_gather.sh && rm -f /tmp/remote_gather.sh"

      - name: Pull raw dumps back
        shell: bash
        run: |
          set -euo pipefail
          sshpass -p "$PASS" scp -P "$PORT" -o StrictHostKeyChecking=no -r "$USER@$HOST:$TARGET/.wtp/state/ci_logs/" "_ci_logs/${RUN_ID}/server/"

      - name: Build snapshot.json + active_plugins_meta.json (locally)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="_ci_logs/${RUN_ID}/server"
          OUT_DIR=".wtp/state/ro/public/${RUN_ID}/server"
          mkdir -p "$ROOT" "$OUT_DIR"

          readfile(){ cat "$1" 2>/dev/null || true; }

          THEMES_JSON="$(readfile "$ROOT/themes.json")"
          jq -e . >/dev/null 2>&1 <<<"${THEMES_JSON:-[]}" || THEMES_JSON="[]"

          PLUGINS_JSON="$(readfile "$ROOT/plugins.json")"
          jq -e . >/dev/null 2>&1 <<<"${PLUGINS_JSON:-[]}" || PLUGINS_JSON="[]"

          ACTIVE_PLUGINS_JSON="$(readfile "$ROOT/active_plugins.json")"
          jq -e . >/dev/null 2>&1 <<<"${ACTIVE_PLUGINS_JSON:-[]}" || ACTIVE_PLUGINS_JSON="[]"

          SITEURL="$(readfile "$ROOT/siteurl.txt")"
          WP_VERSION="$(readfile "$ROOT/wp_version.txt")"
          PHPV="$(head -n1 "$ROOT/php_version.txt" 2>/dev/null || true)"
          UNAME="$(readfile "$ROOT/uname.txt")"
          PWD="$(readfile "$ROOT/pwd.txt")"

          ACTIVE_THEME="$(readfile "$ROOT/active_theme.txt")"
          if [ -z "${ACTIVE_THEME}" ] || [ "${ACTIVE_THEME}" = "null" ]; then
            ACTIVE_THEME="$(jq -r '.[] | select(.status=="active") | .stylesheet' <<<"${THEMES_JSON}" | head -n1)"
          fi

          # derive slugs from active_plugins.json (array of "plugin/file.php")
          if jq -e 'type=="array"' >/dev/null 2>&1 <<<"${ACTIVE_PLUGINS_JSON}"; then
            mapfile -t SLUGS < <(jq -r '.[] | strings' <<<"${ACTIVE_PLUGINS_JSON}" | sed 's/\.php$//' | sed 's#.*/##' | sort -u)
          else
            SLUGS=()
          fi

          mkdir -p "$OUT_DIR/active_meta"
          if [ "${#SLUGS[@]}" -gt 0 ]; then
            for sl in "${SLUGS[@]}"; do
              sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no "$USER@$HOST" \
                "cd '$TARGET' && php ./wp plugin get '${sl}' --fields=name,version,author,plugin_uri,requires,requires_php,update,title,description,slug,status --format=json --path='$TARGET' 2>/dev/null || echo '{}'" \
                > "$OUT_DIR/active_meta/${sl}.json" || echo "{}" > "$OUT_DIR/active_meta/${sl}.json"
            done
          fi

          META_FILES=("$OUT_DIR/active_meta/"*.json)
          if [ ${#META_FILES[@]} -gt 0 ] && [ -f "${META_FILES[0]}" ]; then
            ACTIVE_META_JSON="$(jq -s 'map(select(type=="object"))' "${META_FILES[@]}")"
          else
            ACTIVE_META_JSON="[]"
          fi

          jq -n \
            --arg run_id "${RUN_ID}" \
            --arg siteurl "${SITEURL}" \
            --arg wp_version "${WP_VERSION}" \
            --arg php_version "${PHPV}" \
            --arg uname "${UNAME}" \
            --arg pwd "${PWD}" \
            --arg active_theme "${ACTIVE_THEME}" \
            --argjson themes "${THEMES_JSON:-[]}" \
            --argjson plugins "${PLUGINS_JSON:-[]}" \
            --argjson act "${ACTIVE_PLUGINS_JSON:-[]}" \
            --argjson apm "${ACTIVE_META_JSON:-[]}" \
            '{
              run_id: $run_id,
              server: { uname: $uname, php_version: $php_version },
              wp: { version: $wp_version, siteurl: $siteurl, path: $pwd, active_theme: $active_theme },
              themes: $themes,
              plugins: $plugins,
              active_plugins: $act,
              active_plugins_meta: $apm
            }' > "${OUT_DIR}/snapshot.json"

          {
            echo "# SERVER SNAPSHOT"
            echo "- Run ID: ${RUN_ID}"
            echo "- Site URL: ${SITEURL}"
            echo "- WP: ${WP_VERSION}"
            echo "- PHP: ${PHPV}"
            echo "- Active theme: ${ACTIVE_THEME}"
            echo ""
            echo "## Active plugins (${#SLUGS[@]})"
            for sl in "${SLUGS[@]}"; do echo "- ${sl}"; done
          } > "${OUT_DIR}/SERVER_SNAPSHOT.md"

          printf '%s\n' "${ACTIVE_META_JSON}" > "${OUT_DIR}/active_plugins_meta.json"

      - name: Validate snapshot outputs
        shell: bash
        run: |
          set -euo pipefail
          base=".wtp/state/ro/public/${RUN_ID}/server"
          for f in SERVER_SNAPSHOT.md snapshot.json active_plugins_meta.json; do
            test -s "${base}/${f}" || { echo "::error::Missing or empty ${f}"; exit 1; }
          done
          jq -e 'has("wp") and has("active_plugins")' "${base}/snapshot.json" >/dev/null
          jq -e 'type=="array"' "${base}/active_plugins_meta.json" >/dev/null

      - name: Publish to latest/server (safe rsync)
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          run_dir=".wtp/state/ro/public/${RUN_ID}/server"
          latest_dir=".wtp/state/ro/public/latest/server"
          tmp_dir="${latest_dir}.tmp"

          # remove stale tmp if present
          [ -e "${tmp_dir}" ] && rm -rf "${tmp_dir}" || true

          mkdir -p "${tmp_dir}"
          cp -a "${run_dir}/." "${tmp_dir}/"

          for f in SERVER_SNAPSHOT.md snapshot.json active_plugins_meta.json; do
            test -s "${tmp_dir}/${f}" || { echo "::error::Missing ${f} in tmp"; ls -la "${tmp_dir}"; exit 1; }
          done

          if [ ! -d "${latest_dir}" ]; then
            mv -f "${tmp_dir}" "${latest_dir}"
            echo "::notice::Created latest/server via mv"
            exit 0
          fi

          rsync -a --delete --delete-excluded "${tmp_dir}/" "${latest_dir}/"

          for f in SERVER_SNAPSHOT.md snapshot.json active_plugins_meta.json; do
            test -s "${latest_dir}/${f}" || { echo "::error::After rsync ${f} missing"; exit 1; }
          done

          rm -rf "${tmp_dir}"
          echo "::notice::latest/server updated and tmp removed"

      - name: Commit & push (rebase-safe)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::Nothing to commit."
            exit 0
          fi
          git commit -m "server snapshot ${RUN_ID}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git branch --show-current >/dev/null 2>&1 || git checkout -B "$BRANCH"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git pull --rebase origin "$BRANCH" || { git rebase --continue || true; }
            if git push origin "HEAD:$BRANCH"; then
              echo "::notice::Pushed (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Push failed after 3 attempts"
          exit 1
