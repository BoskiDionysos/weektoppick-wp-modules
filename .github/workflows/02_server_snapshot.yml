name: 02_server_snapshot

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  OUT_BASE: .wtp/state/ro/public

jobs:
  server-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare dirs
        run: |
          set -euo pipefail
          RUN_ID="${{ github.run_id }}"
          OUT_DIR="${{ env.OUT_BASE }}/${RUN_ID}/server"
          LATEST_DIR="${{ env.OUT_BASE }}/latest/server"
          mkdir -p "${OUT_DIR}"
          mkdir -p "${LATEST_DIR}"

      - name: Gather server WP info (sanity + lists)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          PASS: ${{ secrets.DEPLOY_PASS }}
          TARGET: ${{ secrets.DEPLOY_TARGET }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.run_id }}"
          OUT_DIR="${{ env.OUT_BASE }}/${RUN_ID}/server"
          LATEST_DIR="${{ env.OUT_BASE }}/latest/server"
          mkdir -p "$OUT_DIR"

          # sanity commands executed on remote (via sshpass/ssh)
          # create small remote script to run WP-CLI with explicit --path
          cat > /tmp/_wtp_server_snapshot.sh <<'SH'
          set -euo pipefail
          TARGET="${TARGET}"
          cd "$TARGET" || { echo "::error::Cannot cd to TARGET"; exit 1; }
          echo "pwd: $(pwd)"
          echo "whoami: $(whoami)"
          uname -a || true
          which php || true
          php -v || true
          # ensure WP-CLI present
          if [ ! -x ./wp ]; then
            curl -sSL -o wp.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar || true
            [ -f wp.phar ] && chmod +x wp.phar && mv -f wp.phar wp || true
          fi
          # WP info: core, themes, plugins, options
          php ./wp core version --extra --path="$TARGET" --allow-root --skip-plugins --skip-themes --format=json 2>/dev/null || php ./wp --version --path="$TARGET" --allow-root || true
          php ./wp theme list --path="$TARGET" --allow-root --format=json || true
          php ./wp plugin list --path="$TARGET" --allow-root --format=json || true
          php ./wp option get active_plugins --path="$TARGET" --allow-root --format=json || true
          php ./wp option get active_theme --path="$TARGET" --allow-root --format=json || true
          # dump some options for debugging (non-sensitive)
          php ./wp option get home --path="$TARGET" --allow-root --format=json || true
          php ./wp option get siteurl --path="$TARGET" --allow-root --format=json || true
          SH

          # copy and execute
          sudo apt-get update -y
          sudo apt-get install -y sshpass curl
          chmod +x /tmp/_wtp_server_snapshot.sh
          sshpass -p "${PASS}" scp -P "${PORT}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts /tmp/_wtp_server_snapshot.sh "${USER}@${HOST}:/tmp/_wtp_server_snapshot.sh"
          sshpass -p "${PASS}" ssh -p "${PORT}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts "${USER}@${HOST}" "TARGET='${TARGET}' bash /tmp/_wtp_server_snapshot.sh" > "${OUT_DIR}/server_raw.txt" 2>&1 || true

          # Extract JSONs if present from server_raw.txt (best-effort)
          grep -oP '(?s)\{.*\}' "${OUT_DIR}/server_raw.txt" | head -n 1 > "${OUT_DIR}/core_version.json" || true
          # copy raw logs to latest as well
          cp -f "${OUT_DIR}/server_raw.txt" "${LATEST_DIR}/server_raw.txt" || true

      - name: Build snapshot.json and validation
        run: |
          set -euo pipefail
          RUN_ID="${{ github.run_id }}"
          OUT_DIR="${{ env.OUT_BASE }}/${RUN_ID}/server"
          LATEST_DIR="${{ env.OUT_BASE }}/latest/server"
          mkdir -p "${OUT_DIR}" "${LATEST_DIR}"

          # attempt to assemble snapshot from CLI outputs (best-effort parsing)
          CORE="$(sed -n '1,400p' "${OUT_DIR}/server_raw.txt" | sed -n '/{/,/}/p' | head -n 200 || true)"
          THEMES="$(grep -o '\[.*\]' "${OUT_DIR}/server_raw.txt" | head -n 1 || true)"
          PLUGINS="$(grep -o '\[.*\]' "${OUT_DIR}/server_raw.txt" | tail -n +1 | head -n 1 || true)"

          cat > "${OUT_DIR}/snapshot.json" <<JSON
{
  "run_id": "${RUN_ID}",
  "raw_log": "${OUT_DIR}/server_raw.txt",
  "core_raw_excerpt": $(jq -Rs . < "${OUT_DIR}/server_raw.txt")
}
JSON

          # basic validation: ensure plugins entry present and not empty
          if ! grep -q "Plugin Name" "${OUT_DIR}/server_raw.txt" && ! grep -q "plugin" "${OUT_DIR}/server_raw.txt"; then
            echo "::error::server snapshot appears incomplete (no plugin/theme info). Check remote WP-CLI availability and --path."
            exit 1
          fi

          # mirror to latest
          cp -f "${OUT_DIR}/snapshot.json" "${LATEST_DIR}/snapshot.json"
          cp -f "${OUT_DIR}/server_raw.txt" "${LATEST_DIR}/server_raw.txt"
          echo "::notice::Server snapshot written to ${OUT_DIR}/snapshot.json and mirrored to latest."
