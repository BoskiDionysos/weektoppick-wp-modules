name: 02a_server_snapshot (read-only, WP core/themes/plugins/options → JSON)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: server-snapshot
  cancel-in-progress: true

env:
  RUN_ID: ${{ github.run_id }}
  OUT_DIR: .wtp/state/ro/public/${{ github.run_id }}/server
  LATEST_DIR: .wtp/state/ro/public/latest/server

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup jq & ssh tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq

      # Używamy klucza SSH z repo secrets (rekomendowane)
      - name: Setup SSH agent (private key from secrets)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Make dirs
        run: |
          set -euo pipefail
          mkdir -p "_ci_logs/${RUN_ID}/server" "${OUT_DIR}" "${LATEST_DIR}"

      - name: WP snapshot over SSH (core/themes/plugins/options)
        env:
          SSH_USER: ${{ secrets.WTP_SSH_USER }}
          SSH_HOST: ${{ secrets.WTP_SSH_HOST }}
          WP_PATH:  ${{ secrets.WTP_WP_PATH }}
        run: |
          set -euo pipefail
          test -n "${SSH_USER:-}" && test -n "${SSH_HOST:-}" && test -n "${WP_PATH:-}" || { echo "::error::Missing SSH_USER/SSH_HOST/WP_PATH secrets"; exit 1; }

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          # core
          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" "cd '${WP_PATH}' && WP_CLI_CACHE_DIR=/tmp wp core version --extra --format=json" \
            > "_ci_logs/${RUN_ID}/server/wp_core.txt"
          # themes
          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" "cd '${WP_PATH}' && WP_CLI_CACHE_DIR=/tmp wp theme list --format=json" \
            > "_ci_logs/${RUN_ID}/server/themes.json"
          # plugins
          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" "cd '${WP_PATH}' && WP_CLI_CACHE_DIR=/tmp wp plugin list --format=json" \
            > "_ci_logs/${RUN_ID}/server/plugins.json"
          # options (wyciągamy aktywny motyw i listę aktywnych pluginów, jeśli dostępne)
          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" "cd '${WP_PATH}' && WP_CLI_CACHE_DIR=/tmp wp option get stylesheet --format=json || true" \
            > "_ci_logs/${RUN_ID}/server/active_theme.json"
          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" "cd '${WP_PATH}' && WP_CLI_CACHE_DIR=/tmp wp option get template --format=json || true" \
            > "_ci_logs/${RUN_ID}/server/template_theme.json"
          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" "cd '${WP_PATH}' && WP_CLI_CACHE_DIR=/tmp wp option get active_plugins --format=json || true" \
            > "_ci_logs/${RUN_ID}/server/active_plugins.json"

          # Walidacja podstawowa
          test -s "_ci_logs/${RUN_ID}/server/themes.json"   || { echo "::error::themes.json empty"; exit 1; }
          test -s "_ci_logs/${RUN_ID}/server/plugins.json"  || { echo "::error::plugins.json empty"; exit 1; }

          PLUG_COUNT=$(jq 'length' "_ci_logs/${RUN_ID}/server/plugins.json")
          THEME_STYLESHEET=$(jq -r 'select(type=="string") // empty' "_ci_logs/${RUN_ID}/server/active_theme.json")
          if [ "${PLUG_COUNT}" = "0" ]; then
            echo "::error::No plugins returned by wp-cli"; exit 1;
          fi
          if [ -z "${THEME_STYLESHEET}" ]; then
            echo "::warning::Active theme stylesheet not found (wp option get stylesheet). Continuing, but 04 may flag mismatch."
          fi

          # Zbuduj zbiorczy snapshot.json
          jq -n \
            --slurpfile core "_ci_logs/${RUN_ID}/server/wp_core.txt" \
            --slurpfile themes "_ci_logs/${RUN_ID}/server/themes.json" \
            --slurpfile plugins "_ci_logs/${RUN_ID}/server/plugins.json" \
            --slurpfile active_theme "_ci_logs/${RUN_ID}/server/active_theme.json" \
            --slurpfile template_theme "_ci_logs/${RUN_ID}/server/template_theme.json" \
            --slurpfile active_plugins "_ci_logs/${RUN_ID}/server/active_plugins.json" \
            '{
              wp_core: ($core | if length>0 then .[0] else {} end),
              themes: ($themes | if length>0 then .[0] else [] end),
              plugins: ($plugins | if length>0 then .[0] else [] end),
              active_theme: ($active_theme | if length>0 then .[0] else null end),
              template_theme: ($template_theme | if length>0 then .[0] else null end),
              active_plugins: ($active_plugins | if length>0 then .[0] else [] end)
            }' > "_ci_logs/${RUN_ID}/server/snapshot.json"

          # SERWER_SNAPSHOT.md (skrót)
          {
            echo "# SERVER SNAPSHOT"
            echo ""
            echo "- Run ID: ${RUN_ID}"
            echo "- Host: ${SSH_HOST}"
            echo ""
            echo "## Core"
            cat "_ci_logs/${RUN_ID}/server/wp_core.txt" | jq -r '. | to_entries | map("* \(.key): \(.value)")[]'
            echo ""
            echo "## Themes (count $(jq 'length' _ci_logs/${RUN_ID}/server/themes.json))"
            jq -r '.[] | "* \(.name) \(.status) \(.version)"' "_ci_logs/${RUN_ID}/server/themes.json" | head -n 100
            echo ""
            echo "## Plugins (count $(jq 'length' _ci_logs/${RUN_ID}/server/plugins.json))"
            jq -r '.[] | "* \(.name) \(.status) \(.version)"' "_ci_logs/${RUN_ID}/server/plugins.json" | head -n 200
          } > "${OUT_DIR}/SERVER_SNAPSHOT.md"

          # Kopie
          cp -f "_ci_logs/${RUN_ID}/server/snapshot.json" "${OUT_DIR}/snapshot.json"
          cp -f "${OUT_DIR}/snapshot.json" "${LATEST_DIR}/snapshot.json"
          cp -f "${OUT_DIR}/SERVER_SNAPSHOT.md" "${LATEST_DIR}/SERVER_SNAPSHOT.md"

      # Skan sekretów (pre-commit guard)
      - name: Guard against secrets (grep common tokens)
        run: |
          set -euo pipefail
          if grep -RIlE '(ghp_[A-Za-z0-9]{36,}|ssh-rsa AAAA|BEGIN RSA PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY)' "${OUT_DIR}" || true; then
            echo "::error::Potential secret-like pattern detected in server snapshot output. Aborting push."
            exit 1
          fi

      # Commit & push (rebase-safe)
      - name: Commit & push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::Nothing to commit."; exit 0
          fi
          git commit -m "server snapshot ${RUN_ID}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git branch --show-current >/dev/null 2>&1 || git checkout -B "$BRANCH"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git pull --rebase origin "$BRANCH" || { git rebase --continue || true; }
            if git push origin "HEAD:$BRANCH"; then
              echo "::notice::Pushed (attempt $i)"; exit 0
            fi
            sleep 2
          done
          echo "::error::Push failed after 3 attempts"; exit 1
