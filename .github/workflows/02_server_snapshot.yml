name: 02a_server_snapshot (server read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: server-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      RUN_ID: ${{ github.run_id }}
      HOST:   ${{ secrets.DEPLOY_HOST }}
      PORT:   ${{ secrets.DEPLOY_PORT }}
      USER:   ${{ secrets.DEPLOY_USER }}
      PASS:   ${{ secrets.DEPLOY_PASS }}
      TARGET: ${{ secrets.DEPLOY_TARGET }}
      OUT_RUN: .wtp/state/ro/public/${{ github.run_id }}/server
      OUT_LATEST: .wtp/state/ro/public/latest/server
      WTP_CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity secrets
        shell: bash
        run: |
          set -euo pipefail
          for v in HOST PORT USER PASS TARGET; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing secret $v"
              exit 1
            fi
          done

      - name: Setup tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y sshpass curl

      - name: Ensure dirs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "_ci_logs/${RUN_ID}/server" "${OUT_RUN}" "${OUT_LATEST}"

      - name: Run snapshot commands on server (WP-CLI JSON)
        shell: bash
        run: |
          set -euo pipefail
          # zdalny skrypt
          cat > /tmp/wtp_server_snapshot.sh <<'SH'
          set -euo pipefail
          cd "$TARGET"
          # wp-cli lokalnie (jeśli brak) – pobierz
          if [ ! -x ./wp ]; then
            curl -sS -L -o wp.phar https://github.com/wp-cli/wp-cli/releases/latest/download/wp-cli.phar
            php wp.phar --info >/dev/null 2>&1
            chmod +x wp.phar && mv wp.phar wp
          fi

          mkdir -p .wtp/state/ci_logs/server
          # podstawowe informacje
          which php > .wtp/state/ci_logs/server/php_which.txt 2>&1 || true
          php -v     > .wtp/state/ci_logs/server/php_version.txt 2>&1 || true
          uname -a   > .wtp/state/ci_logs/server/uname.txt 2>&1 || true
          pwd        > .wtp/state/ci_logs/server/pwd.txt 2>&1 || true
          ls -la wp-config.php > .wtp/state/ci_logs/server/wp_config_ls.txt 2>&1 || true

          export WP_ALLOW_ROOT=1
          export WTP_CI=1

          # twarde JSONy (bez --skip-plugins dla listowania)
          # u niektórych WP-CLI `--format=json` wypisuje JSON, ale części pól (np. core) trzeba zparsować z tekstu;
          # dlatego robimy osobne pliki i scalamy na końcu po stronie runnera.
          php ./wp core version --extra > .wtp/state/ci_logs/server/wp_core.txt 2>&1 || true
          php ./wp theme list --format=json > .wtp/state/ci_logs/server/themes.json 2>&1 || echo "[]" > .wtp/state/ci_logs/server/themes.json
          php ./wp plugin list --format=json > .wtp/state/ci_logs/server/plugins.json 2>&1 || echo "[]" > .wtp/state/ci_logs/server/plugins.json
          php ./wp option get active_plugins --format=json > .wtp/state/ci_logs/server/wp_active_plugins.json 2>&1 || echo "[]" > .wtp/state/ci_logs/server/wp_active_plugins.json
          php ./wp option get siteurl --format=json > .wtp/state/ci_logs/server/wp_siteurl.json 2>&1 || echo '""' > .wtp/state/ci_logs/server/wp_siteurl.json
          php ./wp option get home    --format=json > .wtp/state/ci_logs/server/wp_home.json 2>&1 || echo '""' > .wtp/state/ci_logs/server/wp_home.json

          # aktywny motyw (fallback: grep po theme list)
          php ./wp theme list --status=active --field=name > .wtp/state/ci_logs/server/theme_active.txt 2>&1 || true
          SH

          # wyślij i odpal
          sshpass -p "$PASS" scp -P "$PORT" \
            -o StrictHostKeyChecking=no \
            /tmp/wtp_server_snapshot.sh "$USER@$HOST:/tmp/wtp_server_snapshot.sh"
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no "$USER@$HOST" \
            "TARGET='$TARGET' bash /tmp/wtp_server_snapshot.sh && rm /tmp/wtp_server_snapshot.sh"

          # pobierz artefakty
          sshpass -p "$PASS" scp -P "$PORT" -r -o StrictHostKeyChecking=no \
            "$USER@$HOST:$TARGET/.wtp/state/ci_logs/server" "_ci_logs/${RUN_ID}/"

      - name: Synthesize snapshot.json & SERVER_SNAPSHOT.md (Python)
        shell: bash
        run: |
          set -euo pipefail
          python - << 'PY'
          import json, re, os
          from pathlib import Path
          rid = os.environ["RUN_ID"]
          src = Path(f"_ci_logs/{rid}/server")
          out_run = Path(os.environ["OUT_RUN"])
          out_latest = Path(os.environ["OUT_LATEST"])
          out_run.mkdir(parents=True, exist_ok=True)
          out_latest.mkdir(parents=True, exist_ok=True)

          def rtxt(name, default=""):
            p = src/name
            if not p.exists(): return default
            return p.read_text(encoding="utf-8", errors="ignore")

          def rjson(name, default=None):
            p = src/name
            if not p.exists():
              return default
            try:
              return json.loads(p.read_text(encoding="utf-8"))
            except Exception:
              return default

          # wp core – tekst -> dict
          core_txt = rtxt("wp_core.txt")
          # próbujemy wyłuskać wersję i PHP req z tekstu
          wp_core = {}
          m = re.search(r"([0-9]+\.[0-9]+(\.[0-9]+)?)", core_txt)
          if m:
            wp_core["version"] = m.group(1)
          # zbierzemy podstawy
          snapshot = {
            "wp_core": wp_core,
            "php": {
              "which": rtxt("php_which.txt").strip(),
              "version": rtxt("php_version.txt").splitlines()[0] if rtxt("php_version.txt") else ""
            },
            "server": {
              "uname": rtxt("uname.txt").strip(),
              "pwd": rtxt("pwd.txt").strip()
            },
            "site": {
              "home": rjson("wp_home.json","") or "",
              "siteurl": rjson("wp_siteurl.json","") or ""
            },
            "theme_active": (rtxt("theme_active.txt").strip() or None),
            "themes": rjson("themes.json", []) or [],
            "plugins": rjson("plugins.json", []) or [],
            "wp_active_plugins_option": rjson("wp_active_plugins.json", []) or []
          }

          # Markdown podgląd
          md = []
          md.append("# SERVER SNAPSHOT")
          md.append(f"- Run ID: {rid}")
          md.append("")
          md.append("## Core / PHP")
          md.append(f"- WP core: `{snapshot['wp_core'].get('version', 'n/a')}`")
          md.append(f"- PHP: `{snapshot['php']['version']}` ({snapshot['php']['which']})")
          md.append("")
          md.append("## Site")
          md.append(f"- home: `{snapshot['site']['home']}`")
          md.append(f"- siteurl: `{snapshot['site']['siteurl']}`")
          md.append(f"- active theme: `{snapshot['theme_active']}`")
          md.append("")
          md.append("## Plugins (counts)")
          act = [p for p in snapshot["plugins"] if p.get("status")=="active"]
          ina = [p for p in snapshot["plugins"] if p.get("status")=="inactive"]
          md.append(f"- Active: **{len(act)}**, Inactive: {len(ina)}")
          md.append("")
          Path(out_run/"snapshot.json").write_text(json.dumps(snapshot, ensure_ascii=False, indent=2), encoding="utf-8")
          Path(out_latest/"snapshot.json").write_text(json.dumps(snapshot, ensure_ascii=False, indent=2), encoding="utf-8")
          Path(out_run/"SERVER_SNAPSHOT.md").write_text("\n".join(md)+"\n", encoding="utf-8")
          Path(out_latest/"SERVER_SNAPSHOT.md").write_text("\n".join(md)+"\n", encoding="utf-8")
          PY

      - name: Secret scrub (redact tokens in public outputs)
        shell: bash
        run: |
          set -euo pipefail
          python - << 'PY'
          import os, re, pathlib
          bases = [
            pathlib.Path(os.environ["OUT_RUN"]).parent.parent,     # .wtp/state/ro/public/<RUN>/
            pathlib.Path(os.environ["OUT_LATEST"]).parent.parent,  # .wtp/state/ro/public/latest/
          ]
          patterns = [
            (re.compile(r"ghp_[A-Za-z0-9]{20,}"), "<REDACTED:GHP>"),
            (re.compile(r"[A-Za-z0-9-_]{10,}\.[A-Za-z0-9-_]{10,}\.[A-Za-z0-9-_]{10,}"), "<REDACTED:JWT>"),
            (re.compile(r"AKIA[0-9A-Z]{16}"), "<REDACTED:AWS_AK>"),
            (re.compile(r"https?://[^/\s:@]+:[^@\s]+@"), "https://<REDACTED>@"),
          ]
          def is_text(p: pathlib.Path)->bool:
            try:
              b = p.read_bytes()
            except: return False
            if b.startswith(b"\x89PNG") or b.startswith(b"\xFF\xD8") or b[:4]==b"%PDF": return False
            try: b.decode("utf-8"); return True
            except: return False
          for base in bases:
            if not base.exists(): continue
            for f in base.rglob("*"):
              if not f.is_file() or not is_text(f): continue
              s = f.read_text(encoding="utf-8", errors="ignore")
              orig = s
              for rx,repl in patterns:
                s = rx.sub(repl, s)
              if s!=orig:
                f.write_text(s, encoding="utf-8")
          PY

      - name: Commit & push (rebase-safe)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::Nothing to commit."
            exit 0
          fi
          git commit -m "server snapshot ${RUN_ID}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git branch --show-current >/dev/null 2>&1 || git checkout -B "$BRANCH"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git pull --rebase origin "$BRANCH" || { git rebase --continue || true; }
            if git push origin "HEAD:$BRANCH"; then
              echo "::notice::Pushed (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Push failed after 3 attempts"
          exit 1
