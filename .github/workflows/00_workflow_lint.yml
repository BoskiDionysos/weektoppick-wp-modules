name: 00_workflow_lint

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: workflow-lint
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4

      # ACTIONLINT (pin do działającego wrappera)
      - name: Actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          level: error
          reporter: github-pr-check

      # YAMLLINT (podstawowa walidacja składni YAML)
      - name: Yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          strict: true
          format: github
