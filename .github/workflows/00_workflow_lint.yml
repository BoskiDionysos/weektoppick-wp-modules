name: 00_workflow_lint

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download actionlint (pinned)
        shell: bash
        run: |
          set -euo pipefail
          VER="v1.7.1"
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- -b ./bin "${VER}"
          ./bin/actionlint --version

      - name: Lint workflows
        shell: bash
        run: |
          set -euo pipefail
          ./bin/actionlint -color

      - name: Show found files
        shell: bash
        if: failure()
        run: |
          ls -la .github/workflows || true
