name: 00_workflow_lint

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: workflow-lint
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ACTIONLINT (sprawdza wyłącznie aktywne workflowy)
      - name: Actionlint via reviewdog
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          level: error
          fail_on_error: true
          # tylko katalog z aktywnymi workflowami
          pattern: ".github/workflows/*.yml"

      # YAMLLINT (również tylko aktywne workflowy)
      - name: Yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          strict: true
          format: github
          file_or_dir: ".github/workflows"
