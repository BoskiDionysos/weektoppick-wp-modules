name: 00_workflow_lint

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/**"
      - "**/*.yml"
      - "**/*.yaml"

permissions:
  contents: read

concurrency:
  group: workflow-lint
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ACTIONLINT (stabilny wrapper)
      - name: Actionlint via reviewdog
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check   # działa także dla workflow_dispatch
          level: error
          fail_on_error: true

      # YAMLLINT (składnia YAML)
      - name: Yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          strict: true
          format: github
