name: 04_ecosystem_correlate (repo ↔ server correlation + ownership + QA)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ecosystem-correlate
  cancel-in-progress: true

jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      RUN_ID: ${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Correlate & build reports
        shell: bash
        run: |
          set -euo pipefail
          OUT=".wtp/state/ro/public/${RUN_ID}/ecosystem"
          LATEST=".wtp/state/ro/public/latest"
          mkdir -p "$OUT" "$LATEST/ecosystem"

          python - << 'PY'
          import json, os, re, glob, pathlib, collections
          RUN_ID = os.environ["RUN_ID"]
          latest = pathlib.Path(".wtp/state/ro/public/latest")
          outdir = pathlib.Path(f".wtp/state/ro/public/{RUN_ID}/ecosystem")
          outdir.mkdir(parents=True, exist_ok=True)

          # --- load inputs (latest) ---
          def read_json(p):
            try:
              return json.loads(pathlib.Path(p).read_text(encoding="utf-8"))
            except Exception:
              return None

          server = read_json(latest/"server/snapshot.json") or {}
          apm    = read_json(latest/"server/active_plugins_meta.json") or []
          repo_plugin_meta = read_json(latest/"repo/plugin_meta.json") or []
          repo_mu_meta     = read_json(latest/"repo/mu_meta.json") or []
          hooks            = read_json(latest/"repo/hooks.json") or []
          symbols          = read_json(latest/"repo/symbol_index.json") or {"functions":[], "classes":[]}
          includes_index   = read_json(latest/"repo/includes_index.json") or []

          # Optional, jeśli jest:
          repo_arch = None
          if (latest/"repo/repo-snapshot.json").exists():
            repo_arch = read_json(latest/"repo/repo-snapshot.json")

          # --- normalize sets ---
          def slug_from_plugin_file(p):
            # 'classic-editor/classic-editor.php' -> 'classic-editor'
            base = p.rsplit("/",1)[0] if "/" in p else p
            base = base.replace(".php","")
            return base.split("/")[-1]

          server_active_slugs = []
          for x in server.get("active_plugins") or []:
            s = slug_from_plugin_file(x)
            if s and s not in server_active_slugs:
              server_active_slugs.append(s)

          repo_plugins = {}  # slug -> meta
          for pm in repo_plugin_meta:
            path = pm.get("path") or ""
            sl = slug_from_plugin_file(path)
            repo_plugins[sl] = pm

          repo_mu = list(repo_mu_meta)  # list of dicts

          # --- ownership map (who-owns-what) ---
          ownership = {
            "seo/meta":        [],
            "seo/sitemap":     [],
            "seo/schema":      [],
            "seo/redirects":   [],
            "perf/cache":      [],
            "perf/image":      [],
            "security/waf":    [],
            "security/login":  [],
            "consent/cookie":  [],
            "links/redirect":  [],
          }
          def own(key, slug):
            if slug not in ownership.get(key, []):
              ownership[key].append(slug)

          # heurystyka po znanych slugach
          for sl in server_active_slugs:
            if sl in ("seo-by-rank-math","rank-math","rankmath","seo-by-rankmath"):
              own("seo/meta", sl); own("seo/sitemap", sl); own("seo/schema", sl); own("seo/redirects", sl)
            if sl in ("litespeed-cache","litespeedcache","litespeed"):
              own("perf/cache", sl); own("perf/image", sl)
            if sl in ("wordfence",):
              own("security/waf", sl); own("security/login", sl)
            if sl in ("cookie-law-info","cookieyes","cookie-law-info-premium"):
              own("consent/cookie", sl)
            if sl in ("pretty-link","pretty-links","pretty-link-lite"):
              own("links/redirect", sl)

          # --- mismatches ---
          repo_plugin_slugs = set(repo_plugins.keys())
          server_slugs_set  = set(server_active_slugs)

          server_plugins_not_in_repo = sorted(list(server_slugs_set - repo_plugin_slugs))
          repo_plugins_not_on_server = sorted(list(repo_plugin_slugs - server_slugs_set))

          # --- validations ---
          warnings = []

          # 1) empty includes_index but repo likely has inc/ or includes/
          if isinstance(includes_index, list) and len(includes_index)==0:
            # heurystyka na podstawie repo_arch (jeśli jest)
            stat_inc = False
            if repo_arch and "files" in repo_arch:
              for f in repo_arch["files"]:
                p = f.get("path","")
                if "/inc/" in p or "/includes/" in p:
                  stat_inc = True; break
            if stat_inc:
              warnings.append("includes_index.json is empty, but repo contains 'inc/' or 'includes/' directories.")

          # 2) empty MU (no hooks and no symbols)
          # zbuduj mapę: plik -> liczba hooków i symboli
          hooks_by_file = collections.Counter([h.get("file","") for h in hooks])
          funcs_by_file = collections.Counter([s.get("file","") for s in symbols.get("functions",[])])
          classes_by_file = collections.Counter([s.get("file","") for s in symbols.get("classes",[])])

          empty_mu = []
          for m in repo_mu:
            path = m.get("path") or ""
            hc = hooks_by_file[path]
            fc = funcs_by_file[path]
            cc = classes_by_file[path]
            if (hc + fc + cc) == 0:
              empty_mu.append(path)

          if empty_mu:
            warnings.append(f"MU plugins with no hooks/functions/classes ({len(empty_mu)}): " + ", ".join(empty_mu[:10]) + ("..." if len(empty_mu)>10 else ""))

          # 3) symbol collisions (functions/classes defined multiple times)
          func_names = [s.get("name") for s in symbols.get("functions",[]) if s.get("name")]
          class_names= [s.get("name") for s in symbols.get("classes",[]) if s.get("name")]
          func_dupes = [n for n,c in collections.Counter(func_names).items() if c>1]
          class_dupes= [n for n,c in collections.Counter(class_names).items() if c>1]
          if func_dupes:
            warnings.append(f"Duplicate function names detected: {', '.join(func_dupes[:15])}" + ("..." if len(func_dupes)>15 else ""))
          if class_dupes:
            warnings.append(f"Duplicate class names detected: {', '.join(class_dupes[:15])}" + ("..." if len(class_dupes)>15 else ""))

          # --- build JSON & MD ---
          eco = {
            "run_id": RUN_ID,
            "server": {
              "wp": server.get("wp",{}),
              "active_plugins": server_active_slugs,
              "active_plugins_meta": apm
            },
            "repo": {
              "plugins": sorted(list(repo_plugin_slugs)),
              "mu_plugins": repo_mu,
            },
            "mismatch": {
              "server_plugins_not_in_repo": server_plugins_not_in_repo,
              "repo_plugins_not_on_server": repo_plugins_not_on_server
            },
            "ownership": ownership,
            "qa": {
              "warnings": warnings,
              "counts": {
                "hooks": len(hooks),
                "functions": len(symbols.get("functions",[])),
                "classes": len(symbols.get("classes",[])),
                "includes": len(includes_index) if isinstance(includes_index, list) else 0,
                "mu_count": len(repo_mu),
                "repo_plugins_count": len(repo_plugins),
                "server_active_plugins_count": len(server_active_slugs)
              }
            }
          }

          md = []
          md.append("# ECOSYSTEM AUDIT")
          md.append(f"- Run ID: {RUN_ID}")
          md.append("")
          md.append("## Server → Active plugins")
          if server_active_slugs:
            md.extend([f"- {s}" for s in server_active_slugs])
          else:
            md.append("_none_")
          md.append("")
          md.append("## Repo → Plugins")
          md.append(", ".join(sorted(list(repo_plugin_slugs))) if repo_plugin_slugs else "_none_")
          md.append("")
          md.append("## Repo → MU-plugins")
          if repo_mu:
            md.extend([f"- {m.get('path','(unknown)')}" for m in repo_mu[:30]])
            if len(repo_mu) > 30: md.append("...")
          else:
            md.append("_none_")
          md.append("")
          md.append("## Ownership (who-owns-what)")
          for k,v in ownership.items():
            md.append(f"- **{k}**: {', '.join(v) if v else '-'}")
          md.append("")
          md.append("## Mismatch")
          md.append(f"- server_plugins_not_in_repo: {', '.join(server_plugins_not_in_repo) if server_plugins_not_in_repo else '-'}")
          md.append(f"- repo_plugins_not_on_server: {', '.join(repo_plugins_not_on_server) if repo_plugins_not_on_server else '-'}")
          md.append("")
          md.append("## QA / Warnings")
          if eco["qa"]["warnings"]:
            for w in eco["qa"]["warnings"]:
              md.append(f"- {w}")
          else:
            md.append("- _none_")
          md.append("")
          md.append("## Counts")
          for k,v in eco["qa"]["counts"].items():
            md.append(f"- {k}: **{v}**")
          md.append("")

          (outdir/"ecosystem-audit.json").write_text(json.dumps(eco, ensure_ascii=False, indent=2), encoding="utf-8")
          (outdir/"ECOSYSTEM_AUDIT.md").write_text("\n".join(md)+"\n", encoding="utf-8")
          PY

          # mirror to latest
          cp -f ".wtp/state/ro/public/${RUN_ID}/ecosystem/ecosystem-audit.json" ".wtp/state/ro/public/latest/ecosystem/ecosystem-audit.json"
          cp -f ".wtp/state/ro/public/${RUN_ID}/ecosystem/ECOSYSTEM_AUDIT.md"    ".wtp/state/ro/public/latest/ecosystem/ECOSYSTEM_AUDIT.md"

      - name: Commit & push (rebase-safe)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::Nothing to commit."
            exit 0
          fi
          git commit -m "ecosystem correlate ${RUN_ID}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git branch --show-current >/dev/null 2>&1 || git checkout -B "$BRANCH"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git pull --rebase origin "$BRANCH" || { git rebase --continue || true; }
            if git push origin "HEAD:$BRANCH"; then
              echo "::notice::Pushed (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Push failed after 3 attempts"
          exit 1
