name: 04_ecosystem_correlate (repo ↔ server)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ecosystem-correlate
  cancel-in-progress: true

jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_ID: ${{ github.run_id }}
      OUT_DIR: .wtp/state/ro/public/${{ github.run_id }}/ecosystem
      LATEST_DIR: .wtp/state/ro/public/latest/ecosystem
      SERVER_SNAPSHOT: .wtp/state/ro/public/latest/server/snapshot.json
      REPO_DIR: .wtp/state/ro/public/latest/repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure output dirs
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}" "${LATEST_DIR}"

      - name: Correlate repo ↔ server and render reports
        shell: bash
        run: |
          set -euo pipefail

          # sanity: wejścia muszą istnieć
          test -f "${SERVER_SNAPSHOT}" || { echo "::error::Missing ${SERVER_SNAPSHOT} (run 02a_server_snapshot first)"; exit 1; }
          test -f "${REPO_DIR}/repo-audit.json" || { echo "::error::Missing ${REPO_DIR}/repo-audit.json (run 03_repo_audit_full first)"; exit 1; }
          test -f "${REPO_DIR}/plugin_meta.json" || { echo "::error::Missing ${REPO_DIR}/plugin_meta.json (run 03_repo_audit_full first)"; exit 1; }
          test -f "${REPO_DIR}/mu_meta.json" || { echo "::error::Missing ${REPO_DIR}/mu_meta.json (run 03_repo_audit_full first)"; exit 1; }

          python - << 'PY'
          import json, os
          from pathlib import Path

          RUN_ID     = os.environ["RUN_ID"]
          OUT_DIR    = Path(os.environ["OUT_DIR"])
          LATEST_DIR = Path(os.environ["LATEST_DIR"])
          REPO_DIR   = Path(os.environ["REPO_DIR"])
          SNAP_FILE  = Path(os.environ["SERVER_SNAPSHOT"])

          OUT_DIR.mkdir(parents=True, exist_ok=True)
          LATEST_DIR.mkdir(parents=True, exist_ok=True)

          def load_json(p: Path, desc: str):
              if not p.exists():
                  raise SystemExit(f"::error::Missing {desc}: {p}")
              try:
                  return json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  raise SystemExit(f"::error::Failed to read {desc}: {p} ({e})")

          # --- LOAD INPUTS ---
          server = load_json(SNAP_FILE, "server snapshot")
          repo_audit = load_json(REPO_DIR / "repo-audit.json", "repo-audit.json")
          repo_plugins_meta = load_json(REPO_DIR / "plugin_meta.json", "plugin_meta.json")
          repo_mu_meta = load_json(REPO_DIR / "mu_meta.json", "mu_meta.json")

          # --- SAFETY / SHAPES ---
          # server plugins come from wp plugin list --format=json
          server_plugins = server.get("wp", {}).get("plugins") or []
          if not isinstance(server_plugins, list):
              server_plugins = []

          server_themes = server.get("wp", {}).get("themes") or []
          if not isinstance(server_themes, list):
              server_themes = []

          active_theme = None
          for th in server_themes:
              # heurystyka: active == true (jeśli nasz snapshot tak zwraca)
              if isinstance(th, dict) and (th.get("status") == "active" or th.get("active") is True):
                  active_theme = th.get("name") or th.get("stylesheet") or th.get("slug")
                  break
          # fallback: niektóre listy nie oznaczają aktywności; spróbuj z options
          if not active_theme:
              # w snapshot.json mamy też "options": {"stylesheet": "...", "template": "..."}
              stylesheet = (server.get("wp", {}).get("options") or {}).get("stylesheet")
              if isinstance(stylesheet, str) and stylesheet:
                  active_theme = stylesheet

          # server active plugins (z wp option get active_plugins)
          server_active_plugins = server.get("wp", {}).get("active_plugins") or []
          if not isinstance(server_active_plugins, list):
              server_active_plugins = []

          # repo-side plugins: budujemy mapę slug -> meta
          # meta zawiera m.in. "path" (pełna ścieżka w repo) oraz header 'Plugin Name', 'Version' itd.
          def slug_from_meta(m):
              # spróbuj slug wyciągnąć z katalogu (wp-content/plugins/<slug>/file.php) albo z samego pliku
              p = m.get("path") or ""
              parts = p.split("/")
              try:
                  i = parts.index("wp-content")
                  if len(parts) > i+2 and parts[i+1] == "plugins":
                      return parts[i+2]  # katalog pluginu
              except ValueError:
                  pass
              # fallback: nazwa pliku bez rozszerzenia
              return Path(p).stem or m.get("name")

          repo_plugins = {}
          for m in repo_plugins_meta:
              sl = slug_from_meta(m)
              if sl:
                  repo_plugins[sl] = m

          # MU-plugins w repo – użyjemy listy ścieżek do korelacji, bo MU bywa w plikach pojedynczych
          repo_mu_set = set()
          for m in repo_mu_meta:
              p = (m.get("path") or "").strip()
              if p:
                  repo_mu_set.add(p)

          # aktywne i zainstalowane po stronie serwera (plugins)
          server_installed_slugs = set()
          server_active_slugs = set()

          for pl in server_plugins:
              if not isinstance(pl, dict): 
                  continue
              # WordPress wp plugin list zazwyczaj zwraca: name, status (active/inactive), update, version
              # Slug możemy spróbować z name (czasem to slug), lub dorobić heurystyką z "name".
              # Lepsza metoda: jeśli mamy server_active_plugins (ścieżki), z nich wyłuskamy slug.
              name = (pl.get("name") or "").strip()
              version = (pl.get("version") or "").strip()
              status = (pl.get("status") or "").strip().lower()
              # heurystyka sluga z nazwy: zamień spacje na myślniki, małe litery
              heur_slug = name.lower().replace(" ", "-") if name else ""
              if heur_slug:
                  server_installed_slugs.add(heur_slug)
              if status == "active":
                  if heur_slug:
                      server_active_slugs.add(heur_slug)

          # jeśli mamy "active_plugins" (ścieżki typu "akismet/akismet.php"), z nich wyłuskaj dokładny slug
          for ap in server_active_plugins:
              # format: folder/file.php → slug = folder
              try:
                  slug = ap.split("/")[0]
                  if slug:
                      server_active_slugs.add(slug)
                      server_installed_slugs.add(slug)
              except Exception:
                  pass

          # --- DIFFS ---
          repo_plugin_slugs = set(repo_plugins.keys())
          only_on_server = sorted(server_installed_slugs - repo_plugin_slugs)
          only_in_repo   = sorted(repo_plugin_slugs - server_installed_slugs)
          active_not_in_repo = sorted([s for s in server_active_slugs if s not in repo_plugin_slugs])

          # wersje (jeśli repo meta ma headers.Version)
          version_mismatches = []
          for sl in sorted(server_installed_slugs & repo_plugin_slugs):
              repo_ver = (repo_plugins[sl].get("version") or "").strip()
              # znajdź wersję z listy serwera (mapa name->version jest niepewna, więc dopasowanie heurystyczne)
              srv_ver = ""
              for pl in server_plugins:
                  nm = (pl.get("name") or "").strip().lower().replace(" ", "-")
                  if nm == sl:
                      srv_ver = (pl.get("version") or "").strip()
                      break
              if srv_ver and repo_ver and srv_ver != repo_ver:
                  version_mismatches.append({"slug": sl, "server_version": srv_ver, "repo_version": repo_ver})

          # MU-plugins korelacja: na serwerze nie mamy listy MU; to jest tylko repo-check
          # raportujemy wyłącznie to, co repo posiada (przegląd), bo server snapshot nie zna MU aktywności
          mu_overview = sorted(repo_mu_set)

          # --- BUILD JSON OUTPUT ---
          out_json = {
              "run_id": RUN_ID,
              "theme": {
                  "server_active": active_theme,
              },
              "plugins": {
                  "server_installed_slugs": sorted(server_installed_slugs),
                  "server_active_slugs": sorted(server_active_slugs),
                  "repo_available_slugs": sorted(repo_plugin_slugs),
                  "only_on_server": only_on_server,
                  "only_in_repo": only_in_repo,
                  "active_not_in_repo": active_not_in_repo,
                  "version_mismatches": version_mismatches,
              },
              "mu_plugins": {
                  "repo_paths": mu_overview
              },
              "meta": {
                  "server_snapshot_file": str(SNAP_FILE),
                  "repo_dir": str(REPO_DIR),
              }
          }

          # --- BUILD MD REPORT ---
          md = []  # <== ważne: inicjalizacja, żeby nie było "no binding for nonlocal 'md'"

          md.append("# ECOSYSTEM AUDIT (repo ↔ server)")
          md.append(f"- Run ID: {RUN_ID}")
          md.append("")
          md.append("## Theme")
          md.append(f"- Active theme on server: **{active_theme or '(unknown)'}**")
          md.append("")
          md.append("## Plugins – overview")
          md.append(f"- Server installed (approx slugs): {len(server_installed_slugs)}")
          md.append(f"- Server active (slugs): {len(server_active_slugs)}")
          md.append(f"- Repo available (slugs): {len(repo_plugin_slugs)}")
          md.append("")
          md.append("### Diff – only on server")
          if only_on_server:
              for sl in only_on_server:
                  md.append(f"- {sl}")
          else:
              md.append("_none_")
          md.append("")
          md.append("### Diff – only in repo (not installed on server)")
          if only_in_repo:
              for sl in only_in_repo:
                  md.append(f"- {sl}")
          else:
              md.append("_none_")
          md.append("")
          md.append("### Active on server but missing in repo")
          if active_not_in_repo:
              for sl in active_not_in_repo:
                  md.append(f"- {sl}")
          else:
              md.append("_none_")
          md.append("")
          md.append("### Version mismatches (server vs repo headers)")
          if out_json["plugins"]["version_mismatches"]:
              for m in out_json["plugins"]["version_mismatches"]:
                  md.append(f"- {m['slug']}: server {m['server_version']} ≠ repo {m['repo_version']}")
          else:
              md.append("_none_")
          md.append("")
          md.append("## MU-plugins (repo overview)")
          if mu_overview:
              for p in mu_overview:
                  md.append(f"- {p}")
          else:
              md.append("_none_")
          md.append("")
          md.append("## Notes")
          md.append("- Slug detection on server uses heuristics; authoritative active list comes from `active_plugins` paths.")
          md.append("- MU-plugins activity cannot be derived from server list; here we show only what exists in the repo.")
          md.append("- Use this report to decide **which plugins to promote into SSOT** and which to **migrate into custom MU**.")

          # --- WRITE OUTPUTS ---
          (OUT_DIR / "ecosystem-audit.json").write_text(json.dumps(out_json, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT_DIR / "ECOSYSTEM_AUDIT.md").write_text("\n".join(md) + "\n", encoding="utf-8")

          # mirror to latest
          (LATEST_DIR / "ecosystem-audit.json").write_text(json.dumps(out_json, ensure_ascii=False, indent=2), encoding="utf-8")
          (LATEST_DIR / "ECOSYSTEM_AUDIT.md").write_text("\n".join(md) + "\n", encoding="utf-8")
          PY

      - name: Commit & push (rebase-safe)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::Nothing to commit."
            exit 0
          fi
          git commit -m "ecosystem correlate ${RUN_ID}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git branch --show-current >/dev/null 2>&1 || git checkout -B "$BRANCH"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git pull --rebase origin "$BRANCH" || { git rebase --continue || true; }
            if git push origin "HEAD:$BRANCH"; then
              echo "::notice::Pushed (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Push failed after 3 attempts"
          exit 1
