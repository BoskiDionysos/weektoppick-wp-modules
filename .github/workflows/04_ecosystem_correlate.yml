name: 04_ecosystem_correlate (repo ↔ server correlation + ownership + QA)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ecosystem-correlate
  cancel-in-progress: true

jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RUN_ID: ${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq rsync
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate inputs (latest/server + latest/repo)
        shell: bash
        run: |
          set -euo pipefail
          base=".wtp/state/ro/public/latest"
          test -s "${base}/server/snapshot.json"                 || { echo "::error::latest server snapshot missing/empty"; exit 2; }
          test -s "${base}/server/active_plugins_meta.json"      || { echo "::error::latest active_plugins_meta missing/empty"; exit 2; }
          test -s "${base}/repo/plugin_meta.json"                || { echo "::error::latest repo plugin_meta missing/empty"; exit 2; }
          test -s "${base}/repo/mu_meta.json"                    || { echo "::error::latest repo mu_meta missing/empty"; exit 2; }
          test -s "${base}/repo/hooks.json"                      || { echo "::error::latest repo hooks missing/empty"; exit 2; }
          test -s "${base}/repo/symbol_index.json"               || { echo "::error::latest repo symbol_index missing/empty"; exit 2; }
          test -s "${base}/repo/includes_index.json"             || { echo "::error::latest repo includes_index missing/empty"; exit 2; }

      - name: Correlate & build reports (to RUN dir)
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR=".wtp/state/ro/public/${RUN_ID}/ecosystem"
          mkdir -p "$OUT_DIR"

          python - << 'PY'
          import json, os, pathlib, collections
          RUN_ID = os.environ["RUN_ID"]
          latest = pathlib.Path(".wtp/state/ro/public/latest")
          outdir = pathlib.Path(f".wtp/state/ro/public/{RUN_ID}/ecosystem")
          outdir.mkdir(parents=True, exist_ok=True)

          def read_json(p):
            try:
              return json.loads(pathlib.Path(p).read_text(encoding="utf-8"))
            except Exception:
              return None

          server = read_json(latest/"server/snapshot.json") or {}
          apm    = read_json(latest/"server/active_plugins_meta.json") or []
          repo_plugin_meta = read_json(latest/"repo/plugin_meta.json") or []
          repo_mu_meta     = read_json(latest/"repo/mu_meta.json") or []
          hooks            = read_json(latest/"repo/hooks.json") or []
          symbols          = read_json(latest/"repo/symbol_index.json") or {"functions":[], "classes":[]}
          includes_index   = read_json(latest/"repo/includes_index.json") or []
          repo_arch         = read_json(latest/"repo/repo-snapshot.json") if (latest/"repo/repo-snapshot.json").exists() else None

          def slug_from_plugin_file(p):
            base = p.rsplit("/",1)[0] if "/" in p else p
            base = base.replace(".php","")
            return base.split("/")[-1]

          server_active_slugs = []
          for x in server.get("active_plugins") or []:
            s = slug_from_plugin_file(x)
            if s and s not in server_active_slugs:
              server_active_slugs.append(s)

          repo_plugins = {}
          for pm in (repo_plugin_meta or []):
            path = pm.get("path") or ""
            if path:
              sl = slug_from_plugin_file(path)
              if sl:
                repo_plugins[sl] = pm

          repo_mu = list(repo_mu_meta or [])

          ownership = {
            "seo/meta":        [],
            "seo/sitemap":     [],
            "seo/schema":      [],
            "seo/redirects":   [],
            "perf/cache":      [],
            "perf/image":      [],
            "security/waf":    [],
            "security/login":  [],
            "consent/cookie":  [],
            "links/redirect":  [],
          }
          def own(key, slug):
            if slug not in ownership.get(key, []):
              ownership[key].append(slug)

          for sl in server_active_slugs:
            if sl in ("seo-by-rank-math","rank-math","rankmath","seo-by-rankmath"):
              own("seo/meta", sl); own("seo/sitemap", sl); own("seo/schema", sl); own("seo/redirects", sl)
            if sl in ("litespeed-cache","litespeedcache","litespeed"):
              own("perf/cache", sl); own("perf/image", sl)
            if sl in ("wordfence",):
              own("security/waf", sl); own("security/login", sl)
            if sl in ("cookie-law-info","cookieyes","cookie-law-info-premium"):
              own("consent/cookie", sl)
            if sl in ("pretty-link","pretty-links","pretty-link-lite"):
              own("links/redirect", sl)

          repo_plugin_slugs = set(repo_plugins.keys())
          server_slugs_set  = set(server_active_slugs)

          server_plugins_not_in_repo = sorted(list(server_slugs_set - repo_plugin_slugs))
          repo_plugins_not_on_server = sorted(list(repo_plugin_slugs - server_slugs_set))

          warnings = []

          if isinstance(includes_index, list) and len(includes_index) == 0:
            if repo_arch and "files" in repo_arch:
              if any(("/inc/" in f.get("path","")) or ("/includes/" in f.get("path","")) for f in repo_arch["files"]):
                warnings.append("includes_index.json is empty, but repo contains 'inc/' or 'includes/' directories.")

          hooks_by_file   = collections.Counter([h.get("file","") for h in (hooks or [])])
          funcs_by_file   = collections.Counter([s.get("file","") for s in (symbols.get("functions",[]) or [])])
          classes_by_file = collections.Counter([s.get("file","") for s in (symbols.get("classes",[]) or [])])

          empty_mu = []
          for m in repo_mu:
            path = m.get("path") or ""
            hc = hooks_by_file[path]
            fc = funcs_by_file[path]
            cc = classes_by_file[path]
            if (hc + fc + cc) == 0:
              empty_mu.append(path)
          if empty_mu:
            warnings.append(f"MU plugins with no hooks/functions/classes ({len(empty_mu)}): " + ", ".join(empty_mu[:10]) + ("..." if len(empty_mu)>10 else ""))

          func_names  = [s.get("name") for s in (symbols.get("functions",[]) or []) if s.get("name")]
          class_names = [s.get("name") for s in (symbols.get("classes",[]) or []) if s.get("name")]
          from collections import Counter
          func_dupes  = [n for n,c in Counter(func_names).items() if c>1]
          class_dupes = [n for n,c in Counter(class_names).items() if c>1]
          if func_dupes:
            warnings.append("Duplicate function names detected: " + ", ".join(func_dupes[:15]) + ("..." if len(func_dupes)>15 else ""))
          if class_dupes:
            warnings.append("Duplicate class names detected: " + ", ".join(class_dupes[:15]) + ("..." if len(class_dupes)>15 else ""))

          eco = {
            "run_id": RUN_ID,
            "server": {
              "wp": server.get("wp",{}),
              "active_plugins": server_active_slugs,
              "active_plugins_meta": apm
            },
            "repo": {
              "plugins": sorted(list(repo_plugin_slugs)),
              "mu_plugins": repo_mu,
            },
            "mismatch": {
              "server_plugins_not_in_repo": server_plugins_not_in_repo,
              "repo_plugins_not_on_server": repo_plugins_not_on_server
            },
            "ownership": ownership,
            "qa": {
              "warnings": warnings,
              "counts": {
                "hooks": len(hooks or []),
                "functions": len((symbols.get("functions",[]) or [])),
                "classes": len((symbols.get("classes",[]) or [])),
                "includes": len(includes_index) if isinstance(includes_index, list) else 0,
                "mu_count": len(repo_mu),
                "repo_plugins_count": len(repo_plugin_slugs),
                "server_active_plugins_count": len(server_active_slugs)
              }
            }
          }

          md = []
          md.append("# ECOSYSTEM AUDIT")
          md.append(f"- Run ID: {RUN_ID}")
          md.append("")
          md.append("## Server → Active plugins")
          md.extend([f"- {s}" for s in server_active_slugs] or ["_none_"])
          md.append("")
          md.append("## Repo → Plugins")
          md.append(", ".join(sorted(list(repo_plugin_slugs))) if repo_plugin_slugs else "_none_")
          md.append("")
          md.append("## Repo → MU-plugins")
          if repo_mu:
            md.extend([f"- {m.get('path','(unknown)')}" for m in repo_mu[:30]])
            if len(repo_mu) > 30: md.append("...")
          else:
            md.append("_none_")
          md.append("")
          md.append("## Ownership (who-owns-what)")
          for k,v in ownership.items():
            md.append(f"- **{k}**: {', '.join(v) if v else '-'}")
          md.append("")
          md.append("## Mismatch")
          md.append(f"- server_plugins_not_in_repo: {', '.join(server_plugins_not_in_repo) if server_plugins_not_in_repo else '-'}")
          md.append(f"- repo_plugins_not_on_server: {', '.join(repo_plugins_not_on_server) if repo_plugins_not_on_server else '-'}")
          md.append("")
          md.append("## QA / Warnings")
          if eco["qa"]["warnings"]:
            for w in eco["qa"]["warnings"]:
              md.append(f"- {w}")
          else:
            md.append("- _none_")
          md.append("")
          md.append("## Counts")
          for k,v in eco["qa"]["counts"].items():
            md.append(f"- {k}: **{v}**")
          md.append("")

          (outdir/"ecosystem-audit.json").write_text(json.dumps(eco, ensure_ascii=False, indent=2), encoding="utf-8")
          (outdir/"ECOSYSTEM_AUDIT.md").write_text("\n".join(md)+"\n", encoding="utf-8")
          PY

      - name: Validate outputs (non-empty + basic schema)
        shell: bash
        run: |
          set -euo pipefail
          base=".wtp/state/ro/public/${RUN_ID}/ecosystem"
          for f in ecosystem-audit.json ECOSYSTEM_AUDIT.md; do
            test -s "${base}/${f}" || { echo "::error::Missing or empty ${f}"; exit 1; }
          done
          jq -e 'has("run_id") and has("server") and has("repo")' "${base}/ecosystem-audit.json" >/dev/null

      - name: Publish to latest/ecosystem (safe rsync)
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          run_dir=".wtp/state/ro/public/${RUN_ID}/ecosystem"
          latest_dir=".wtp/state/ro/public/latest/ecosystem"
          tmp_dir="${latest_dir}.tmp"

          [ -e "${tmp_dir}" ] && rm -rf "${tmp_dir}" || true
          mkdir -p "${tmp_dir}"
          cp -a "${run_dir}/." "${tmp_dir}/"

          for f in ecosystem-audit.json ECOSYSTEM_AUDIT.md; do
            test -s "${tmp_dir}/${f}" || { echo "::error::Missing ${f} in tmp"; ls -la "${tmp_dir}"; exit 1; }
          done

          if [ ! -d "${latest_dir}" ]; then
            mv -f "${tmp_dir}" "${latest_dir}"
            echo "::notice::Created latest/ecosystem via mv"
            exit 0
          fi

          rsync -a --delete --delete-excluded "${tmp_dir}/" "${latest_dir}/"

          for f in ecosystem-audit.json ECOSYSTEM_AUDIT.md; do
            test -s "${latest_dir}/${f}" || { echo "::error::After rsync ${f} missing"; exit 1; }
          done

          rm -rf "${tmp_dir}"
          echo "::notice::latest/ecosystem updated and tmp removed"

      - name: Commit & push (rebase-safe)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::Nothing to commit."
            exit 0
          fi
          git commit -m "ecosystem correlate ${RUN_ID}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git branch --show-current >/dev/null 2>&1 || git checkout -B "$BRANCH"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git pull --rebase origin "$BRANCH" || { git rebase --continue || true; }
            if git push origin "HEAD:$BRANCH"; then
              echo "::notice::Pushed (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Push failed after 3 attempts"
          exit 1
