name: 04_ecosystem_correlate (repo↔server correlation)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ecosystem-correlate
  cancel-in-progress: true

env:
  RUN_ID: ${{ github.run_id }}
  LATEST: .wtp/state/ro/public/latest
  OUT: .wtp/state/ro/public/${{ github.run_id }}/ecosystem

jobs:
  correlate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup jq
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Ensure inputs exist
        run: |
          set -euo pipefail
          test -f "${LATEST}/server/snapshot.json" || { echo "::error::Missing latest/server/snapshot.json (run 02a first)"; exit 1; }
          test -f "${LATEST}/repo/repo-audit.json"  || { echo "::error::Missing latest/repo/repo-audit.json (run 03_repo_audit_full)"; exit 1; }
          test -f "${LATEST}/repo/plugin_meta.json" || { echo "::error::Missing latest/repo/plugin_meta.json"; exit 1; }
          test -f "${LATEST}/repo/mu_meta.json"     || { echo "::error::Missing latest/repo/mu_meta.json"; exit 1; }

      - name: Correlate
        run: |
          set -euo pipefail
          mkdir -p "${OUT}" "${LATEST}/ecosystem"

          # Zbuduj zestawy: nazwy pluginów z serwera vs z repo (po nazwie pliku i/lub nagłówku)
          # Server side
          jq -r '.plugins[]?.name' "${LATEST}/server/snapshot.json" | sort -u > "${OUT}/_server_plugins_names.txt" || true
          jq -r '.active_plugins[]? // empty' "${LATEST}/server/snapshot.json" | sort -u > "${OUT}/_server_active_plugins_option.txt" || true
          jq -r '.active_theme // empty' "${LATEST}/server/snapshot.json" > "${OUT}/_server_active_theme.txt" || true

          # Repo side
          jq -r '.[].name // ""' "${LATEST}/repo/plugin_meta.json" | sed '/^$/d' | sort -u > "${OUT}/_repo_plugins_names.txt" || true
          jq -r '.[].path // ""' "${LATEST}/repo/plugin_meta.json" | sed '/^$/d' | sort -u > "${OUT}/_repo_plugins_paths.txt" || true
          jq -r '.[].path // ""' "${LATEST}/repo/mu_meta.json"     | sed '/^$/d' | sort -u > "${OUT}/_repo_mu_paths.txt" || true

          SERVER_ONLY=$(comm -23 "${OUT}/_server_plugins_names.txt" "${OUT}/_repo_plugins_names.txt" | wc -l)
          REPO_ONLY=$(comm -13 "${OUT}/_server_plugins_names.txt" "${OUT}/_repo_plugins_names.txt" | wc -l)

          # JSON raport
          jq -n \
            --argfile server "${LATEST}/server/snapshot.json" \
            --argfile repoAudit "${LATEST}/repo/repo-audit.json" \
            --slurpfile repoPlugins "${LATEST}/repo/plugin_meta.json" \
            --slurpfile repoMU "${LATEST}/repo/mu_meta.json" \
            --arg server_only_count "${SERVER_ONLY}" \
            --arg repo_only_count "${REPO_ONLY}" \
            '{
              server: $server,
              repo_audit: $repoAudit,
              repo_plugins: ($repoPlugins|if length>0 then .[0] else [] end),
              repo_mu: ($repoMU|if length>0 then .[0] else [] end),
              summary: {
                server_only_plugins_count: ($server_only_count|tonumber),
                repo_only_plugins_count: ($repo_only_count|tonumber)
              }
            }' > "${OUT}/ecosystem-audit.json"

          # Markdown
          {
            echo "# ECOSYSTEM AUDIT"
            echo "- Run ID: ${RUN_ID}"
            echo ""
            echo "## Mismatch (counts)"
            echo "- Plugins present on server only: ${SERVER_ONLY}"
            echo "- Plugins present in repo only:   ${REPO_ONLY}"
            echo ""
            echo "## Active theme (server)"
            if [ -s "${OUT}/_server_active_theme.txt" ]; then
              echo "- $(cat "${OUT}/_server_active_theme.txt")"
            else
              echo "- (not reported)"
            fi
            echo ""
            echo "## Notes"
            echo "- Compare repo/plugin_meta.json vs server plugins list for functional coverage."
          } > "${OUT}/ECOSYSTEM_AUDIT.md"

          # Mirror to latest
          cp -f "${OUT}/ecosystem-audit.json" "${LATEST}/ecosystem/ecosystem-audit.json"
          cp -f "${OUT}/ECOSYSTEM_AUDIT.md"   "${LATEST}/ecosystem/ECOSYSTEM_AUDIT.md"

      - name: Commit & push (rebase-safe)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::Nothing to commit."; exit 0
          fi
          git commit -m "ecosystem correlate ${RUN_ID}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git branch --show-current >/dev/null 2>&1 || git checkout -B "$BRANCH"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git pull --rebase origin "$BRANCH" || { git rebase --continue || true; }
            if git push origin "HEAD:$BRANCH"; then
              echo "::notice::Pushed (attempt $i)"; exit 0
            fi
            sleep 2
          done
          echo "::error::Push failed after 3 attempts"; exit 1
