name: 04_ecosystem_correlate (repo ↔ server, final)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ecosystem-correlate
  cancel-in-progress: true

jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_ID: ${{ github.run_id }}
      LATEST_REPO: .wtp/state/ro/public/latest/repo
      LATEST_SERVER: .wtp/state/ro/public/latest/server
      OUT: .wtp/state/ro/public/${{ github.run_id }}/ecosystem
      LATEST_OUT: .wtp/state/ro/public/latest/ecosystem

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Ensure inputs exist + build correlation
        shell: bash
        run: |
          set -euo pipefail
          test -f "${LATEST_REPO}/plugin_meta.json" || { echo "::error::missing plugin_meta.json (run 03)"; exit 1; }
          test -f "${LATEST_REPO}/mu_meta.json" || { echo "::error::missing mu_meta.json (run 03)"; exit 1; }
          test -f "${LATEST_REPO}/hooks.json" || { echo "::error::missing hooks.json (run 03)"; exit 1; }
          test -f "${LATEST_SERVER}/snapshot.json" || { echo "::error::missing server snapshot (run 02a)"; exit 1; }
          mkdir -p "${OUT}" "${LATEST_OUT}"
          python - <<'PY'
          import os, json, pathlib, re
          RUN_ID=os.environ["RUN_ID"]
          LREPO=os.environ["LATEST_REPO"]; LSRV=os.environ["LATEST_SERVER"]
          OUT=os.environ["OUT"]; LOUT=os.environ["LATEST_OUT"]
          out=pathlib.Path(OUT); out.mkdir(parents=True,exist_ok=True)
          def jload(p): return json.load(open(p,"r",encoding="utf-8"))
          plugin_meta=jload(f"{LREPO}/plugin_meta.json")
          mu_meta=jload(f"{LREPO}/mu_meta.json")
          hooks=jload(f"{LREPO}/hooks.json")
          server=jload(f"{LSRV}/snapshot.json")
          # normalize repo entities by slug (folder)
          def slug_from_path(p):
            p=p.replace("\\","/")
            # try wp-content/plugins/<slug>/...
            m=re.search(r"wp-content/plugins/([^/]+)/", p)
            if m: return m.group(1)
            # mu-plugins can be flat; use filename or parent
            m=re.search(r"(?:wp-content/)?mu-plugins/([^/]+)/", p)
            if m: return m.group(1)
            m=re.search(r"(?:wp-content/)?mu-plugins/([^/]+)\.php$", p)
            if m: return m.group(1)
            return None
          repo_plugins={}
          for r in plugin_meta:
            sl=slug_from_path(r.get("path","")) or r.get("name") or "unknown"
            repo_plugins.setdefault(sl,[]).append(r)
          repo_mu={}
          for r in mu_meta:
            sl=slug_from_path(r.get("path","")) or r.get("name") or "unknown"
            repo_mu.setdefault(sl,[]).append(r)
          # server plugins
          s_plugins=server.get("wp",{}).get("plugins",[])
          s_active_raw=server.get("wp",{}).get("active_plugins_option","").strip()
          s_template=server.get("wp",{}).get("template","")
          # try decode serialized PHP array (best-effort); fallback to search slugs
          active_slugs=[]
          if s_active_raw.startswith("a:") or s_active_raw.startswith("b:") or s_active_raw.startswith("s:"):
            # very rough fallback: extract '/<slug>.php' fragments
            for m in re.finditer(r"/([^/]+)\.php", s_active_raw): active_slugs.append(m.group(1))
          else:
            # maybe JSON-ish array
            for m in re.finditer(r"['\"]([^'\"]+)\/([^'\"]+)\.php['\"]", s_active_raw):
              active_slugs.append(m.group(1))
          active_slugs=sorted(set(active_slugs))
          # correlation
          missing_on_repo=[]; zombie_in_repo=[]; version_mismatch=[]
          s_by_slug={}
          for sp in s_plugins:
            # wp-cli plugin list uses 'name' as slug typically
            sl=sp.get("name") or sp.get("plugin") or sp.get("title") or ""
            if sl: s_by_slug[sl]=sp
          # compare active
          for sl in active_slugs:
            if sl not in repo_plugins:
              missing_on_repo.append({"slug":sl,"why":"active_on_server_but_absent_in_repo"})
          # zombie: repo but not on server list at all
          for sl in repo_plugins.keys():
            if sl not in s_by_slug:
              zombie_in_repo.append({"slug":sl,"why":"present_in_repo_but_not_listed_on_server"})
          # version mismatch (best effort)
          for sl, rs in repo_plugins.items():
            sv=s_by_slug.get(sl,{}).get("version")
            if sv:
              # pick first repo version header if exists
              rv=rs[0].get("version")
              if rv and rv != sv:
                version_mismatch.append({"slug":sl,"repo_version":rv,"server_version":sv})
          # theme presence
          theme_mismatch=None
          if s_template:
            # check if theme dir exists in repo
            tdir=pathlib.Path(f"wp-content/themes/{s_template}")
            theme_mismatch = None if tdir.exists() else {"active_theme":s_template,"present_in_repo": tdir.exists()}
          # hooks gap (only simple check: hooks referenced by active slugs should exist somewhere in repo)
          # Build set of repo files per slug for quick scan
          repo_hook_names=set([h["hook"] for h in hooks if isinstance(h,dict) and "hook" in h])
          hooks_gap=[]
          # heuristic: if no hooks at all for active slugs (cannot map exactly callback→slug here), skip
          if not repo_hook_names:
            hooks_gap.append({"note":"no hooks detected in repo; run 03 again if this seems wrong"})
          # build report
          report={
            "run_id": RUN_ID,
            "active_slugs": active_slugs,
            "missing_on_repo": missing_on_repo,
            "zombie_in_repo": zombie_in_repo,
            "version_mismatch": version_mismatch,
            "theme_mismatch": theme_mismatch,
            "summary": {
              "active_slugs": len(active_slugs),
              "missing_on_repo": len(missing_on_repo),
              "zombie_in_repo": len(zombie_in_repo),
              "version_mismatch": len(version_mismatch),
              "theme_mismatch": 1 if theme_mismatch else 0
            }
          }
          out.joinpath("ecosystem-audit.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          md=[]
          md.append("# ECOSYSTEM AUDIT")
          md.append(f"- Run: {RUN_ID}")
          md.append("## Summary")
          for k,v in report["summary"].items(): md.append(f"- {k}: **{v}**")
          md.append("")
          def section(title, arr):
            nonlocal md
            md.append(f"## {title}")
            if not arr: md.append("- none"); return
            for it in arr[:200]: md.append(f"- {json.dumps(it,ensure_ascii=False)}")
            md.append("")
          section("Missing on repo (active on server, absent in repo)", report["missing_on_repo"])
          section("Zombie in repo (present in repo, not listed on server)", report["zombie_in_repo"])
          section("Version mismatch", report["version_mismatch"])
          md.append("## Theme mismatch")
          md.append(f"- {json.dumps(report['theme_mismatch'],ensure_ascii=False) if report['theme_mismatch'] else 'none'}")
          pathlib.Path(os.environ["OUT"]).joinpath("ECOSYSTEM_AUDIT.md").write_text("\n".join(md)+"\n",encoding="utf-8")
          # mirror to latest
          lout=pathlib.Path(LOUT); lout.mkdir(parents=True,exist_ok=True)
          for n in ["ecosystem-audit.json","ECOSYSTEM_AUDIT.md"]:
            lout.joinpath(n).write_text(out.joinpath(n).read_text(encoding="utf-8"), encoding="utf-8")
          PY

      - name: Commit & push correlation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::Nothing to commit."
            exit 0
          fi
          git commit -m "ecosystem correlate ${RUN_ID}"
          BR="${GITHUB_REF_NAME:-main}"
          git fetch origin "$BR"
          git pull --rebase origin "$BR" || { git rebase --continue || true; }
          git push origin "HEAD:$BR"
