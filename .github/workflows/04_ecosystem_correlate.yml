name: 04_ecosystem_correlate (repo ↔ server, validations)

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["02a_server_snapshot (read-only, server state, enriched)", "03_repo_audit_full (read-only, complete repo scan)"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: ecosystem-correlate
  cancel-in-progress: true

jobs:
  correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_ID: ${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Load inputs (latest snapshots)
        run: |
          set -euo pipefail
          test -f ".wtp/state/ro/public/latest/server/snapshot.json" || { echo "::error::Missing latest server snapshot"; exit 1; }
          test -f ".wtp/state/ro/public/latest/repo/plugin_meta.json" || { echo "::error::Missing latest repo plugin_meta.json"; exit 1; }
          test -f ".wtp/state/ro/public/latest/repo/mu_meta.json" || { echo "::error::Missing latest repo mu_meta.json"; exit 1; }
          test -f ".wtp/state/ro/public/latest/repo/hooks.json" || { echo "::warning::Missing hooks.json"; }
          test -f ".wtp/state/ro/public/latest/repo/symbol_index.json" || { echo "::warning::Missing symbol_index.json"; }

      - name: Correlate + validations → ECOSYSTEM_AUDIT
        run: |
          set -euo pipefail
          python - << 'PY'
          import json, os, pathlib
          rid=os.environ["RUN_ID"]
          ROOT=pathlib.Path(".wtp/state/ro/public")
          OUT=ROOT/f"{rid}/ecosystem"; OUT.mkdir(parents=True, exist_ok=True)
          LATEST=ROOT/"latest/ecosystem"; LATEST.mkdir(parents=True, exist_ok=True)

          server=json.loads((ROOT/"latest/server/snapshot.json").read_text(encoding="utf-8"))
          plugin_meta=json.loads((ROOT/"latest/repo/plugin_meta.json").read_text(encoding="utf-8"))
          mu_meta=json.loads((ROOT/"latest/repo/mu_meta.json").read_text(encoding="utf-8"))
          hooks=json.loads((ROOT/"latest/repo/hooks.json").read_text(encoding="utf-8")) if (ROOT/"latest/repo/hooks.json").exists() else []
          symbols=json.loads((ROOT/"latest/repo/symbol_index.json").read_text(encoding="utf-8")) if (ROOT/"latest/repo/symbol_index.json").exists() else {"functions":[],"classes":[]}

          # ---- normalize server active plugins ----
          act = server.get("wp",{}).get("active_plugins")
          if isinstance(act, list):
              active_slugs=[]
              for it in act:
                  # WP stores strings like 'plugin-dir/plugin-file.php'
                  if isinstance(it,str):
                      slug=it.split("/")[0]
                      active_slugs.append(slug)
          else:
              active_slugs=[]

          # names/slugs from repo
          def slug_of(rec):
              # try from root path parent dir name if available
              root = rec.get("root_file")
              if root:
                  p=pathlib.Path(root)
                  return p.parent.name
              # fallback to lowercased name
              nm=(rec.get("name") or "").strip().lower().replace(" ","-")
              return nm or None

          repo_plugins = {slug_of(r): r for r in plugin_meta if slug_of(r)}
          repo_mu      = {slug_of(r): r for r in mu_meta if slug_of(r)}

          active_in_repo   = [s for s in active_slugs if s in repo_plugins]
          missing_in_repo  = [s for s in active_slugs if s not in repo_plugins and s not in repo_mu]
          mu_candidates    = [s for s in active_slugs if s in repo_mu]

          # basic stats
          stats = {
            "server_active_plugins_count": len(active_slugs),
            "repo_plugins_count": len(repo_plugins),
            "repo_mu_count": len(repo_mu),
            "active_found_in_repo": len(active_in_repo),
            "active_missing_in_repo": len(missing_in_repo),
            "active_resolved_in_mu": len(mu_candidates),
            "hooks": len(hooks),
            "functions": len(symbols.get("functions",[])),
            "classes": len(symbols.get("classes",[]))
          }

          # thresholds for failure
          errors=[]
          if len(active_slugs) > 0 and (len(active_in_repo) == 0):
              errors.append("None of server active plugins were found in repo (plugin_meta/mu_meta mismatch).")
          if len(missing_in_repo) > 0:
              errors.append(f"Active on server but missing in repo: {', '.join(sorted(missing_in_repo)[:30])}{'…' if len(missing_in_repo)>30 else ''}")

          # Emit JSON
          eco = {
            "run_id": rid,
            "stats": stats,
            "active_in_repo": active_in_repo,
            "active_missing_in_repo": missing_in_repo,
            "active_resolved_in_mu": mu_candidates,
            "note": "Resolve missing_in_repo by committing those plugins (or replacing with custom/MU)."
          }
          (OUT/"ecosystem-audit.json").write_text(json.dumps(eco, ensure_ascii=False, indent=2), encoding="utf-8")
          (LATEST/"ecosystem-audit.json").write_text((OUT/"ecosystem-audit.json").read_text(encoding="utf-8"), encoding="utf-8")

          # Emit MD
          md=[]
          md.append("# ECOSYSTEM AUDIT")
          md.append(f"- Run ID: {rid}")
          md.append("")
          md.append("## Stats")
          for k,v in stats.items(): md.append(f"- {k}: **{v}**")
          md.append("")
          md.append("## Active plugins → correlation")
          md.append(f"- Found in repo: {len(active_in_repo)}")
          md.append(f"- Missing in repo: {len(missing_in_repo)}")
          if missing_in_repo:
              md.append("  - " + ", ".join(sorted(missing_in_repo)[:50]) + ("…" if len(missing_in_repo)>50 else ""))
          if mu_candidates:
              md.append(f"- Resolved by MU: {len(mu_candidates)}")
          md.append("")
          if errors:
              md.append("## Errors")
              for e in errors: md.append(f"- {e}")
          (OUT/"ECOSYSTEM_AUDIT.md").write_text("\n".join(md)+"\n", encoding="utf-8")
          (LATEST/"ECOSYSTEM_AUDIT.md").write_text((OUT/"ECOSYSTEM_AUDIT.md").read_text(encoding="utf-8"), encoding="utf-8")

          # Hard fail on validation errors
          if errors:
              raise SystemExit("Validation failed: " + " | ".join(errors))
          PY

      - name: Commit & push (rebase-safe)
        if: ${{ success() }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::Nothing to commit."
            exit 0
          fi
          git commit -m "ecosystem correlate ${RUN_ID}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git branch --show-current >/dev/null 2>&1 || git checkout -B "$BRANCH"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git pull --rebase origin "$BRANCH" || { git rebase --continue || true; }
            if git push origin "HEAD:$BRANCH"; then
              echo "::notice::Pushed (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Push failed after 3 attempts"
          exit 1
