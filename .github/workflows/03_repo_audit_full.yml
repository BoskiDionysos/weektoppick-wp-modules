name: 03_repo_audit_full (read-only, complete)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-audit-full
  cancel-in-progress: true

env:
  RUN_ID: ${{ github.run_id }}
  OUT_REPO: .wtp/state/ro/public/${{ github.run_id }}/repo
  LATEST: .wtp/state/ro/public/latest

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Ensure dirs
        run: |
          set -euo pipefail
          mkdir -p "_out/repo_audit/${RUN_ID}" "${OUT_REPO}" "${LATEST}/repo"

      - name: Build file/workflow indexes
        run: |
          set -euo pipefail
          git ls-files -co --exclude-standard > "_out/repo_audit/${RUN_ID}/filelist.txt"
          ls -laR > "_out/repo_audit/${RUN_ID}/tree.txt"
          python - << 'PY'
          import os, glob, json, yaml, pathlib
          rid = os.environ["RUN_ID"]
          out = pathlib.Path(f"_out/repo_audit/{rid}")
          out.mkdir(parents=True, exist_ok=True)
          items=[]
          for p in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  with open(p, "r", encoding="utf-8") as f:
                      y = yaml.safe_load(f) or {}
              except Exception as e:
                  y = {"_parse_error": str(e)}
              items.append({
                  "file": os.path.basename(p),
                  "name": y.get("name", os.path.basename(p)),
                  "on": y.get("on"),
                  "jobs": list((y.get("jobs") or {}).keys())
              })
          (out/"workflows.json").write_text(json.dumps(items, ensure_ascii=False, indent=2), encoding="utf-8")
          with open(out/"workflows.md","w",encoding="utf-8") as f:
              f.write("# Workflows index\n\n")
              for w in items:
                  f.write(f"## {w['name']} ({w['file']})\n")
                  f.write(f"- Triggers: `{w['on']}`\n")
                  f.write(f"- Jobs: {', '.join(w['jobs']) if w['jobs'] else '-'}\n\n")
          PY

      - name: Scan repo → plugin/mu meta + hooks/symbols/includes + deps
        run: |
          set -euo pipefail
          python - << 'PY'
          import os, re, json
          from pathlib import Path

          RUN_ID = os.environ["RUN_ID"]
          OUT = Path(os.environ["OUT_REPO"])
          AUX = Path(f"_out/repo_audit/{RUN_ID}")
          OUT.mkdir(parents=True, exist_ok=True)

          # --- helpers ---
          def walk_php(bases):
              for b in bases:
                  p = Path(b)
                  if not p.exists():
                      continue
                  for f in p.rglob("*.php"):
                      s = str(f)
                      if "/vendor/" in s or "/node_modules/" in s:
                          continue
                      yield f

          header_line = re.compile(r"^\s*([A-Za-z][A-Za-z \-]+):\s*(.+)\s*$")
          def parse_headers(php_file):
              headers={}
              try:
                  with open(php_file,"r",encoding="utf-8",errors="ignore") as f:
                      for i,ln in zip(range(60),f):
                          m = header_line.match(ln)
                          if m:
                              headers[m.group(1).strip()] = m.group(2).strip()
              except Exception:
                  pass
              return headers

          def plugin_record(path, headers, kind):
              return {
                  "kind": kind,
                  "path": str(path),
                  "name": headers.get("Plugin Name"),
                  "plugin_uri": headers.get("Plugin URI"),
                  "description": headers.get("Description"),
                  "version": headers.get("Version"),
                  "author": headers.get("Author"),
                  "author_uri": headers.get("Author URI"),
                  "text_domain": headers.get("Text Domain"),
                  "domain_path": headers.get("Domain Path"),
                  "requires_wp": headers.get("Requires at least"),
                  "tested_wp": headers.get("Tested up to"),
                  "requires_php": headers.get("Requires PHP"),
                  "network": headers.get("Network"),
              }

          # regular plugins
          plugin_meta=[]
          plugins_dir = Path("wp-content/plugins")
          if plugins_dir.exists():
              for entry in sorted(plugins_dir.iterdir()):
                  if entry.is_dir():
                      main=None
                      for p in entry.glob("*.php"):
                          h=parse_headers(p)
                          if "Plugin Name" in h:
                              plugin_meta.append(plugin_record(p,h,"plugin"))
                              main=p; break
                      if not main:
                          for p in entry.rglob("*.php"):
                              h=parse_headers(p)
                              if "Plugin Name" in h:
                                  plugin_meta.append(plugin_record(p,h,"plugin"))
                                  break
                  elif entry.suffix==".php":
                      h=parse_headers(entry)
                      if "Plugin Name" in h:
                          plugin_meta.append(plugin_record(entry,h,"plugin"))

          # mu-plugins (zbieramy wszystko)
          mu_meta=[]
          mu_dir=Path("wp-content/mu-plugins")
          if mu_dir.exists():
              for p in sorted(mu_dir.rglob("*.php")):
                  h=parse_headers(p)
                  mu_meta.append(plugin_record(p,h,"mu"))

          # hooks/symbols/includes
          hook_calls=[]
          sym_index={"functions":[], "classes":[]}
          includes=[]
          re_add_action  = re.compile(r"\badd_action\s*\(\s*['\"]([^'\"]+)['\"]")
          re_add_filter  = re.compile(r"\badd_filter\s*\(\s*['\"]([^'\"]+)['\"]")
          re_do_action   = re.compile(r"\bdo_action\s*\(\s*['\"]([^'\"]+)['\"]")
          re_apply_filt  = re.compile(r"\bapply_filters\s*\(\s*['\"]([^'\"]+)['\"]")
          re_func = re.compile(r"\bfunction\s+([A-Za-z0-9_]+)\s*\(")
          re_class = re.compile(r"\bclass\s+([A-Za-z0-9_]+)\b")
          re_inc = re.compile(r"\b(require|require_once|include|include_once)\s*\(\s*['\"]([^'\"]+)['\"]\s*\)")

          scan_dirs=["wp-content/plugins","wp-content/mu-plugins","wp-content/themes",".wtp","inc","includes","plugins","mu-plugins"]
          for php in walk_php(scan_dirs):
              try:
                  src=php.read_text(encoding="utf-8",errors="ignore")
              except Exception:
                  continue
              for m in re_add_action.finditer(src):   hook_calls.append({"type":"add_action","hook":m.group(1),"file":str(php)})
              for m in re_add_filter.finditer(src):  hook_calls.append({"type":"add_filter","hook":m.group(1),"file":str(php)})
              for m in re_do_action.finditer(src):   hook_calls.append({"type":"do_action","hook":m.group(1),"file":str(php)})
              for m in re_apply_filt.finditer(src):  hook_calls.append({"type":"apply_filters","hook":m.group(1),"file":str(php)})

              for m in re_func.finditer(src):        sym_index["functions"].append({"name":m.group(1),"file":str(php)})
              for m in re_class.finditer(src):       sym_index["classes"].append({"name":m.group(1),"file":str(php)})

              for m in re_inc.finditer(src):         includes.append({"type":m.group(1),"target":m.group(2),"file":str(php)})

          # dependencies: mapa plik -> cele include/require (prosta lista)
          from collections import defaultdict
          deps=defaultdict(list)
          for inc in includes:
              deps[inc["file"]].append({"type":inc["type"],"target":inc["target"]})
          dependencies={"edges":[{"from":k,"to":v} for k,v in deps.items()]}

          # zapisz
          OUT.write_text  # no-op to ensure OUT exists
          (OUT/"plugin_meta.json").write_text(json.dumps(plugin_meta, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT/"mu_meta.json").write_text(json.dumps(mu_meta, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT/"hooks.json").write_text(json.dumps(hook_calls, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT/"symbol_index.json").write_text(json.dumps(sym_index, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT/"includes_index.json").write_text(json.dumps(includes, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT/"dependencies.json").write_text(json.dumps(dependencies, ensure_ascii=False, indent=2), encoding="utf-8")

          audit={
            "run_id": RUN_ID,
            "counts":{
              "plugins": len(plugin_meta),
              "mu_plugins": len(mu_meta),
              "hooks": len(hook_calls),
              "functions": len(sym_index["functions"]),
              "classes": len(sym_index["classes"]),
              "includes": len(includes)
            }
          }
          (OUT/"repo-audit.json").write_text(json.dumps(audit, ensure_ascii=False, indent=2), encoding="utf-8")

          md=[]
          md.append("# REPO AUDIT (full)")
          md.append(f"- Run ID: {RUN_ID}")
          md.append("")
          md.append("## Totals")
          for k,v in audit["counts"].items():
              md.append(f"- {k}: **{v}**")
          md.append("")
          md.append("## Notes")
          md.append("- MU & plugins parsed; hooks/symbols/includes via grep-like regex; see JSON for details.")
          (OUT/"REPO_AUDIT.md").write_text("\n".join(md)+"\n", encoding="utf-8")

          # skopiuj do latest
          latest = Path(os.environ["LATEST"])
          (latest/"repo").mkdir(parents=True, exist_ok=True)

          for src, dst in [
            (Path(f"_out/repo_audit/{RUN_ID}/filelist.txt"), latest/"repo"/"filelist.txt"),
            (Path(f"_out/repo_audit/{RUN_ID}/tree.txt"),     latest/"repo"/"tree.txt"),
            (Path(f"_out/repo_audit/{RUN_ID}/workflows.json"), latest/"repo"/"workflows.json"),
            (Path(f"_out/repo_audit/{RUN_ID}/workflows.md"), latest/"repo"/"workflows.md"),
          ]:
              if src.exists():
                  dst.write_text(src.read_text(encoding="utf-8"), encoding="utf-8")

          for name in ["REPO_AUDIT.md","repo-audit.json","plugin_meta.json","mu_meta.json","hooks.json","symbol_index.json","includes_index.json","dependencies.json"]:
              s = (OUT/name)
              d = latest/"repo"/name
              if s.exists():
                  d.write_text(s.read_text(encoding="utf-8"), encoding="utf-8")
          PY

      - name: Secret scan (audit outputs)
        run: |
          set -euo pipefail
          if grep -RIlE '(ghp_[A-Za-z0-9]{36,}|ssh-rsa AAAA|BEGIN RSA PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY)' "${OUT_REPO}" || true; then
            echo "::error::Secret-like pattern detected in repo audit outputs"; exit 1;
          fi

      - name: Commit & push (rebase-safe)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::Nothing to commit."; exit 0
          fi
          git commit -m "repo audit (full) ${RUN_ID}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git branch --show-current >/dev/null 2>&1 || git checkout -B "$BRANCH"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git pull --rebase origin "$BRANCH" || { git rebase --continue || true; }
            if git push origin "HEAD:$BRANCH"; then
              echo "::notice::Pushed (attempt $i)"; exit 0
            fi
            sleep 2
          done
          echo "::error::Push failed after 3 attempts"; exit 1
