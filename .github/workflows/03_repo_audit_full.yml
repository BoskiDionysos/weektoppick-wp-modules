name: 03_repo_audit_full (read-only, complete repo scan)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-audit-full
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_ID: ${{ github.run_id }}
      OUT: .wtp/state/ro/public/${{ github.run_id }}/repo
      LATEST: .wtp/state/ro/public/latest/repo

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Ensure dirs
        run: |
          set -euo pipefail
          mkdir -p "_out/repo_audit/${RUN_ID}" "${OUT}" "${LATEST}"

      - name: Build basic indexes (filelist/tree/workflows)
        run: |
          set -euo pipefail
          git ls-files -co --exclude-standard > "_out/repo_audit/${RUN_ID}/filelist.txt"
          ls -laR > "_out/repo_audit/${RUN_ID}/tree.txt"
          python - << 'PY'
          import glob, json, yaml, os, pathlib
          out = pathlib.Path("_out/repo_audit/"+os.environ["RUN_ID"])
          arr=[]
          for p in sorted(glob.glob(".github/workflows/*.yml")):
            try:
              y=yaml.safe_load(open(p,encoding="utf-8")) or {}
            except Exception as e:
              y={"_parse_error":str(e)}
            arr.append({"file":os.path.basename(p),"name":y.get("name",os.path.basename(p)),"on":y.get("on"),"jobs":list((y.get("jobs") or {}).keys())})
          (out/"workflows.json").write_text(json.dumps(arr,ensure_ascii=False,indent=2),encoding="utf-8")
          with open(out/"workflows.md","w",encoding="utf-8") as f:
            f.write("# Workflows index\n\n")
            for w in arr:
              f.write(f"## {w['name']} ({w['file']})\n- Triggers: `{w['on']}`\n- Jobs: {', '.join(w['jobs']) if w['jobs'] else '-'}\n\n")
          PY

      - name: Scan repo → plugins/MU + hooks/symbols/includes + dependencies
        run: |
          set -euo pipefail
          python - << 'PY'
          import os, re, json
          from pathlib import Path

          RUN_ID = os.environ["RUN_ID"]
          OUT = Path(os.environ["OUT"]); OUT.mkdir(parents=True, exist_ok=True)
          AUX = Path(f"_out/repo_audit/{RUN_ID}"); AUX.mkdir(parents=True, exist_ok=True)

          # Ścieżki w repo (nietypowe w Twoim projekcie)
          PLUG_DIRS = [Path("wp-content/plugins"), Path("plugins")]
          MU_DIRS   = [Path("wp-content/mu-plugins"), Path("mu-plugins")]
          THEME_DIRS= [Path("wp-content/themes"), Path("themes")]

          def existing_dirs(paths): return [p for p in paths if p.exists()]

          header_line = re.compile(r"^\s*(?P<key>[A-Za-z][A-Za-z \-]+):\s*(?P<val>.+)\s*$")
          def parse_headers(php_file):
              headers={}
              try:
                  with open(php_file,"r",encoding="utf-8",errors="ignore") as f:
                      for i,ln in enumerate(f):
                          if i>80: break
                          m=header_line.match(ln)
                          if m: headers[m.group("key").strip()]=m.group("val").strip()
              except Exception:
                  pass
              return headers

          def soft_json(p):
              try: return json.loads(Path(p).read_text(encoding="utf-8"))
              except Exception: return None

          def soft_text(p, maxkb=64):
              try:
                  t=Path(p).read_text(encoding="utf-8",errors="ignore")
                  return t[:maxkb*1024] if len(t)>maxkb*1024 else t
              except Exception:
                  return None

          def plugin_rec(kind, root_file):
              h=parse_headers(root_file)
              base=Path(root_file).parent
              return {
                "kind": kind,
                "root_file": str(root_file),
                "name": h.get("Plugin Name"),
                "version": h.get("Version"),
                "description": h.get("Description"),
                "author": h.get("Author"),
                "requires_php": h.get("Requires PHP"),
                "requires_wp":  h.get("Requires at least"),
                "tested_wp":    h.get("Tested up to"),
                "text_domain":  h.get("Text Domain"),
                "plugin_uri":   h.get("Plugin URI"),
                "author_uri":   h.get("Author URI"),
                "composer":     soft_json(base/"composer.json"),
                "readme_excerpt": soft_text(base/"readme.txt", maxkb=32)
              }

          def find_plugin_roots(base):
              roots=[]
              if not base.exists(): return roots
              if base.is_file() and base.suffix==".php":
                  h=parse_headers(base)
                  if "Plugin Name" in h: roots.append(base)
                  return roots
              for entry in base.iterdir():
                  if entry.is_dir():
                      found=None
                      for p in entry.glob("*.php"):
                          h=parse_headers(p)
                          if "Plugin Name" in h:
                              roots.append(p); found=True; break
                      if not found:
                          for p in entry.rglob("*.php"):
                              h=parse_headers(p)
                              if "Plugin Name" in h:
                                  roots.append(p); break
                  elif entry.is_file() and entry.suffix==".php":
                      h=parse_headers(entry)
                      if "Plugin Name" in h: roots.append(entry)
              return roots

          # Collect plugin_meta & mu_meta
          plugin_meta=[]
          for d in existing_dirs(PLUG_DIRS):
              for root in find_plugin_roots(d):
                  plugin_meta.append(plugin_rec("plugin", root))

          mu_meta=[]
          for d in existing_dirs(MU_DIRS):
              for root in find_plugin_roots(d):
                  mu_meta.append(plugin_rec("mu", root))

          # Hooks, symbols, includes
          search_roots = existing_dirs(PLUG_DIRS+MU_DIRS+THEME_DIRS)+[Path(".wtp"),Path("inc"),Path("includes")]
          def walk_php(paths):
              for base in paths:
                  for p in base.rglob("*.php"):
                      s=str(p)
                      if "/vendor/" in s or "/node_modules/" in s: continue
                      yield p

          re_add_action  = re.compile(r"\badd_action\s*\(\s*['\"]([^'\"]+)['\"]", re.I)
          re_add_filter  = re.compile(r"\badd_filter\s*\(\s*['\"]([^'\"]+)['\"]", re.I)
          re_do_action   = re.compile(r"\bdo_action\s*\(\s*['\"]([^'\"]+)['\"]", re.I)
          re_apply_filt  = re.compile(r"\bapply_filters\s*\(\s*['\"]([^'\"]+)['\"]", re.I)
          re_func        = re.compile(r"\bfunction\s+([a-zA-Z0-9_]+)\s*\(", re.I)
          re_class       = re.compile(r"\bclass\s+([a-zA-Z0-9_]+)\b", re.I)
          re_inc         = re.compile(r"\b(require|require_once|include|include_once)\s*\(\s*['\"]([^'\"]+)['\"]\s*\)", re.I)

          hooks=[]; symbols={"functions":[], "classes":[]}; includes=[]
          for php in walk_php(search_roots):
              try: src=php.read_text(encoding="utf-8",errors="ignore")
              except Exception: continue
              hooks += [{"type":"add_action","hook":m.group(1),"file":str(php)} for m in re_add_action.finditer(src)]
              hooks += [{"type":"add_filter","hook":m.group(1),"file":str(php)} for m in re_add_filter.finditer(src)]
              hooks += [{"type":"do_action","hook":m.group(1),"file":str(php)} for m in re_do_action.finditer(src)]
              hooks += [{"type":"apply_filters","hook":m.group(1),"file":str(php)} for m in re_apply_filt.finditer(src)]
              symbols["functions"] += [{"name":m.group(1),"file":str(php)} for m in re_func.finditer(src)]
              symbols["classes"]   += [{"name":m.group(1),"file":str(php)} for m in re_class.finditer(src)]
              includes += [{"type":m.group(1),"target":m.group(2),"file":str(php)} for m in re_inc.finditer(src)]

          # Dependencies (prosty graf require/include: plik -> targets)
          from collections import defaultdict
          deps = defaultdict(list)
          for inc in includes:
              deps[inc["file"]].append({"type":inc["type"],"target":inc["target"]})

          # Write outputs
          OUT.joinpath("plugin_meta.json").write_text(json.dumps(plugin_meta,ensure_ascii=False,indent=2),encoding="utf-8")
          OUT.joinpath("mu_meta.json").write_text(json.dumps(mu_meta,ensure_ascii=False,indent=2),encoding="utf-8")
          OUT.joinpath("hooks.json").write_text(json.dumps(hooks,ensure_ascii=False,indent=2),encoding="utf-8")
          OUT.joinpath("symbol_index.json").write_text(json.dumps(symbols,ensure_ascii=False,indent=2),encoding="utf-8")
          OUT.joinpath("includes_index.json").write_text(json.dumps(includes,ensure_ascii=False,indent=2),encoding="utf-8")
          OUT.joinpath("dependencies.json").write_text(json.dumps(deps,ensure_ascii=False,indent=2),encoding="utf-8")

          counts={"plugins":len(plugin_meta),"mu_plugins":len(mu_meta),"hooks":len(hooks),"functions":len(symbols["functions"]),"classes":len(symbols["classes"]),"includes":len(includes)}
          OUT.joinpath("repo-audit.json").write_text(json.dumps({"run_id":RUN_ID,"counts":counts},ensure_ascii=False,indent=2),encoding="utf-8")

          md=["# REPO AUDIT (full)",f"- Run ID: {RUN_ID}","","## Totals"]
          for k,v in counts.items(): md.append(f"- {k}: **{v}**")
          md.append(""); md.append("## Notes"); md.append("- MU & plugins parsed from headers + composer/readme; hooks/symbols/includes grep-based.")
          OUT.joinpath("REPO_AUDIT.md").write_text("\n".join(md)+"\n",encoding="utf-8")

          # mirror stałych indeksów do latest/repo + root latest
          latest = Path(os.environ["LATEST"]); latest.mkdir(parents=True, exist_ok=True)
          # filelist/tree/workflows z AUX do latest/repo-root
          for src, dst in [
            (Path(f"_out/repo_audit/{RUN_ID}/filelist.txt"), Path(".wtp/state/ro/public/latest/repo/filelist.txt")),
            (Path(f"_out/repo_audit/{RUN_ID}/tree.txt"),     Path(".wtp/state/ro/public/latest/repo/tree.txt")),
            (Path(f"_out/repo_audit/{RUN_ID}/workflows.json"), Path(".wtp/state/ro/public/latest/repo/workflows.json")),
            (Path(f"_out/repo_audit/{RUN_ID}/workflows.md"),   Path(".wtp/state/ro/public/latest/repo/workflows.md")),
          ]:
            if src.exists():
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_text(src.read_text(encoding="utf-8"), encoding="utf-8")

          for name in ["REPO_AUDIT.md","repo-audit.json","plugin_meta.json","mu_meta.json","hooks.json","symbol_index.json","includes_index.json","dependencies.json"]:
            src=OUT/name; dst=Path(".wtp/state/ro/public/latest/repo")/name
            if src.exists():
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_text(src.read_text(encoding="utf-8"), encoding="utf-8")
          PY

      - name: Commit & push (rebase-safe)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::Nothing to commit."
            exit 0
          fi
          git commit -m "repo audit (full) ${RUN_ID}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git branch --show-current >/dev/null 2>&1 || git checkout -B "$BRANCH"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git pull --rebase origin "$BRANCH" || { git rebase --continue || true; }
            if git push origin "HEAD:$BRANCH"; then
              echo "::notice::Pushed (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Push failed after 3 attempts"
          exit 1
