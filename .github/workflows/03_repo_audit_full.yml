name: 03_repo_audit_full (read-only, complete)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-audit-full
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      RUN_ID: ${{ github.run_id }}
      OUT_RUN: .wtp/state/ro/public/${{ github.run_id }}/repo
      OUT_LATEST: .wtp/state/ro/public/latest/repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Ensure dirs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUT_RUN}" "${OUT_LATEST}"
          mkdir -p "_out/repo_audit/${RUN_ID}"

      - name: File/workflow index
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -co --exclude-standard > "_out/repo_audit/${RUN_ID}/filelist.txt"
          ls -laR > "_out/repo_audit/${RUN_ID}/tree.txt"
          python - << 'PY'
          import os, glob, json, yaml, pathlib
          rid = os.environ["RUN_ID"]
          out = pathlib.Path(f"_out/repo_audit/{rid}")
          items=[]
          for p in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  y = yaml.safe_load(open(p, "r", encoding="utf-8")) or {}
              except Exception as e:
                  y = {"_parse_error": str(e)}
              items.append({
                  "file": os.path.basename(p),
                  "name": y.get("name", os.path.basename(p)),
                  "on": y.get("on"),
                  "jobs": list((y.get("jobs") or {}).keys())
              })
          (out/"workflows.json").write_text(json.dumps(items, ensure_ascii=False, indent=2), encoding="utf-8")
          with open(out/"workflows.md","w",encoding="utf-8") as f:
              f.write("# Workflows index\n\n")
              for w in items:
                  f.write(f"## {w['name']} ({w['file']})\n")
                  f.write(f"- Triggers: `{w['on']}`\n")
                  f.write(f"- Jobs: {', '.join(w['jobs']) if w['jobs'] else '-'}\n\n")
          PY
          # skopiuj lekkie indeksy do latest/repo
          cp -f "_out/repo_audit/${RUN_ID}/filelist.txt" ".wtp/state/ro/public/latest/repo/filelist.txt" || true
          cp -f "_out/repo_audit/${RUN_ID}/tree.txt"     ".wtp/state/ro/public/latest/repo/tree.txt" || true
          cp -f "_out/repo_audit/${RUN_ID}/workflows.json" ".wtp/state/ro/public/latest/repo/workflows.json" || true
          cp -f "_out/repo_audit/${RUN_ID}/workflows.md"   ".wtp/state/ro/public/latest/repo/workflows.md" || true

      - name: Scan repo (plugins/MU/hooks/symbols/includes/deps)
        shell: bash
        run: |
          set -euo pipefail
          python - << 'PY'
          import os, re, json
          from pathlib import Path
          rid = os.environ["RUN_ID"]
          OUT_RUN = Path(os.environ["OUT_RUN"]); OUT_RUN.mkdir(parents=True, exist_ok=True)
          OUT_LATEST = Path(os.environ["OUT_LATEST"]); OUT_LATEST.mkdir(parents=True, exist_ok=True)

          # ścieżki w obu wariantach (jak w repo i jak w WP standard)
          SEARCH_PLUGINS = ["wp-content/plugins", "plugins"]
          SEARCH_MU      = ["wp-content/mu-plugins", "mu-plugins"]
          SEARCH_THEMES  = ["wp-content/themes", "themes"]
          CUSTOM_CODE    = [".wtp", "inc", "includes"]

          def walk_php(bases):
              for b in bases:
                  p = Path(b)
                  if not p.exists(): continue
                  for f in p.rglob("*.php"):
                      s = str(f)
                      if "/vendor/" in s or "/node_modules/" in s:
                          continue
                      yield f

          header_line = re.compile(r"^\s*(?P<key>[A-Za-z][A-Za-z \-]+):\s*(?P<val>.+)\s*$")
          def parse_headers(path: Path, limit=80):
              headers={}
              try:
                  with path.open("r", encoding="utf-8", errors="ignore") as fh:
                      for i,ln in enumerate(fh):
                          if i>limit: break
                          m = header_line.match(ln)
                          if m:
                              headers[m.group("key").strip()] = m.group("val").strip()
              except Exception:
                  return {}
              return headers

          def mk_rec(path: Path, headers: dict, kind: str):
              return {
                  "kind": kind,
                  "path": str(path),
                  "name": headers.get("Plugin Name"),
                  "plugin_uri": headers.get("Plugin URI"),
                  "description": headers.get("Description"),
                  "version": headers.get("Version"),
                  "author": headers.get("Author"),
                  "author_uri": headers.get("Author URI"),
                  "text_domain": headers.get("Text Domain"),
                  "domain_path": headers.get("Domain Path"),
                  "requires_wp": headers.get("Requires at least"),
                  "tested_wp": headers.get("Tested up to"),
                  "requires_php": headers.get("Requires PHP"),
                  "network": headers.get("Network"),
              }

          # plugins
          plugin_meta=[]
          for base in SEARCH_PLUGINS:
              bp = Path(base)
              if not bp.exists(): continue
              for entry in sorted(bp.iterdir()):
                  if entry.is_file() and entry.suffix==".php":
                      h = parse_headers(entry)
                      if "Plugin Name" in h:
                          plugin_meta.append(mk_rec(entry, h, "plugin"))
                  elif entry.is_dir():
                      found=False
                      for p in entry.glob("*.php"):
                          h = parse_headers(p)
                          if "Plugin Name" in h:
                              plugin_meta.append(mk_rec(p, h, "plugin")); found=True; break
                      if not found:
                          for p in entry.rglob("*.php"):
                              h = parse_headers(p)
                              if "Plugin Name" in h:
                                  plugin_meta.append(mk_rec(p, h, "plugin")); break

          # mu-plugins (pojedyncze pliki i foldery)
          mu_meta=[]
          for base in SEARCH_MU:
              bp = Path(base)
              if not bp.exists(): continue
              for p in bp.rglob("*.php"):
                  h = parse_headers(p)
                  mu_meta.append(mk_rec(p, h, "mu"))

          # hooks/symbols/includes
          hooks=[]; symbols={"functions":[],"classes":[]}; includes=[]
          rx = {
            "add_action": re.compile(r"\badd_action\s*\(\s*['\"]([^'\"]+)['\"]", re.I),
            "add_filter": re.compile(r"\badd_filter\s*\(\s*['\"]([^'\"]+)['\"]", re.I),
            "do_action": re.compile(r"\bdo_action\s*\(\s*['\"]([^'\"]+)['\"]", re.I),
            "apply_filters": re.compile(r"\bapply_filters\s*\(\s*['\"]([^'\"]+)['\"]", re.I),
            "func": re.compile(r"\bfunction\s+([a-zA-Z0-9_]+)\s*\(", re.I),
            "class": re.compile(r"\bclass\s+([a-zA-Z0-9_]+)\b", re.I),
            "inc": re.compile(r"\b(require|require_once|include|include_once)\s*\(\s*['\"]([^'\"]+)['\"]\s*\)", re.I),
          }

          scan_bases = SEARCH_PLUGINS + SEARCH_MU + SEARCH_THEMES + CUSTOM_CODE
          for php in walk_php(scan_bases):
              try:
                  s = php.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              for k in ("add_action","add_filter","do_action","apply_filters"):
                  for m in rx[k].finditer(s):
                      hooks.append({"type":k,"hook":m.group(1),"file":str(php)})
              for m in rx["func"].finditer(s):
                  symbols["functions"].append({"name":m.group(1),"file":str(php)})
              for m in rx["class"].finditer(s):
                  symbols["classes"].append({"name":m.group(1),"file":str(php)})
              for m in rx["inc"].finditer(s):
                  includes.append({"type":m.group(1),"target":m.group(2),"file":str(php)})

          # deps (prosty graf require/include)
          nodes=set(); edges=[]
          for inc in includes:
              src = inc["file"]; tgt = inc["target"]
              nodes.add(src); nodes.add(tgt)
              edges.append({"from":src,"to":tgt,"type":inc["type"]})
          deps = {"nodes": sorted(nodes), "edges": edges}

          # repo-audit summary
          audit = {
            "run_id": rid,
            "counts": {
              "plugins": len(plugin_meta),
              "mu_plugins": len(mu_meta),
              "hooks": len(hooks),
              "functions": len(symbols["functions"]),
              "classes": len(symbols["classes"]),
              "includes": len(includes),
              "deps_nodes": len(deps["nodes"]),
              "deps_edges": len(deps["edges"]),
            }
          }

          # write outputs (RUN)
          (OUT_RUN/"plugin_meta.json").write_text(json.dumps(plugin_meta, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT_RUN/"mu_meta.json").write_text(json.dumps(mu_meta, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT_RUN/"hooks.json").write_text(json.dumps(hooks, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT_RUN/"symbol_index.json").write_text(json.dumps(symbols, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT_RUN/"includes_index.json").write_text(json.dumps(includes, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT_RUN/"dependencies.json").write_text(json.dumps(deps, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT_RUN/"repo-audit.json").write_text(json.dumps(audit, ensure_ascii=False, indent=2), encoding="utf-8")

          # REPO_AUDIT.md
          md=[]
          md.append("# REPO AUDIT (full)")
          md.append(f"- Run ID: {rid}")
          md.append("")
          for k,v in audit["counts"].items():
              md.append(f"- {k}: **{v}**")
          md.append("")
          (OUT_RUN/"REPO_AUDIT.md").write_text("\n".join(md)+"\n", encoding="utf-8")

          # mirror -> latest
          for name in ["plugin_meta.json","mu_meta.json","hooks.json","symbol_index.json","includes_index.json","dependencies.json","repo-audit.json","REPO_AUDIT.md"]:
              dst = OUT_LATEST/name
              src = OUT_RUN/name
              dst.write_text(src.read_text(encoding="utf-8"), encoding="utf-8")
          PY

      - name: Secret scrub (redact tokens in public outputs)
        shell: bash
        run: |
          set -euo pipefail
          python - << 'PY'
          import os, re, pathlib
          bases = [
            pathlib.Path(os.environ["OUT_RUN"]).parent.parent,     # .wtp/state/ro/public/<RUN>/
            pathlib.Path(os.environ["OUT_LATEST"]).parent.parent,  # .wtp/state/ro/public/latest/
          ]
          patterns = [
            (re.compile(r"ghp_[A-Za-z0-9]{20,}"), "<REDACTED:GHP>"),
            (re.compile(r"[A-Za-z0-9-_]{10,}\.[A-Za-z0-9-_]{10,}\.[A-Za-z0-9-_]{10,}"), "<REDACTED:JWT>"),
            (re.compile(r"AKIA[0-9A-Z]{16}"), "<REDACTED:AWS_AK>"),
            (re.compile(r"https?://[^/\s:@]+:[^@\s]+@"), "https://<REDACTED>@"),
            (re.compile(r"(?i)(api[_-]?key|secret|token|passwd|password)\s*[=:]\s*[A-Za-z0-9._-]{6,}"), r"\1=<REDACTED>"),
          ]
          def is_text(p: pathlib.Path)->bool:
            try:
              b = p.read_bytes()
            except: return False
            if b.startswith(b"\x89PNG") or b.startswith(b"\xFF\xD8") or b[:4]==b"%PDF": return False
            try: b.decode("utf-8"); return True
            except: return False
          for base in bases:
            if not base.exists(): continue
            for f in base.rglob("*"):
              if not f.is_file() or not is_text(f): continue
              s = f.read_text(encoding="utf-8", errors="ignore")
              orig = s
              for rx,repl in patterns:
                s = rx.sub(repl, s)
              if s!=orig:
                f.write_text(s, encoding="utf-8")
          PY

      - name: Commit & push (rebase-safe)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::Nothing to commit."
            exit 0
          fi
          git commit -m "repo audit (full) ${RUN_ID}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git branch --show-current >/dev/null 2>&1 || git checkout -B "$BRANCH"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git pull --rebase origin "$BRANCH" || { git rebase --continue || true; }
            if git push origin "HEAD:$BRANCH"; then
              echo "::notice::Pushed (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Push failed after 3 attempts"
          exit 1
