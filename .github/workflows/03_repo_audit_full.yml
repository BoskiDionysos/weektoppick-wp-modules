name: 03_repo_audit_full (repo audit + dependencies enrichment)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-audit-full
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_ID: ${{ github.run_id }}
      OUT: .wtp/state/ro/public/${{ github.run_id }}/repo
      LATEST: .wtp/state/ro/public/latest/repo

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq rsync
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Ensure dirs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "_out/repo_audit/${RUN_ID}" "${OUT}"

      - name: Build file/workflow indexes
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -co --exclude-standard > "_out/repo_audit/${RUN_ID}/filelist.txt"
          ls -laR > "_out/repo_audit/${RUN_ID}/tree.txt"
          python - << 'PY'
          import os, glob, json, yaml, pathlib
          rid = os.environ["RUN_ID"]
          out = pathlib.Path(f"_out/repo_audit/{rid}")
          out.mkdir(parents=True, exist_ok=True)
          items=[]
          for p in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  with open(p, "r", encoding="utf-8") as f:
                      y = yaml.safe_load(f) or {}
              except Exception as e:
                  y = {"_parse_error": str(e)}
              items.append({
                  "file": os.path.basename(p),
                  "name": y.get("name", os.path.basename(p)),
                  "on": y.get("on"),
                  "jobs": list((y.get("jobs") or {}).keys())
              })
          (out/"workflows.json").write_text(json.dumps(items, ensure_ascii=False, indent=2), encoding="utf-8")
          with open(out/"workflows.md","w",encoding="utf-8") as f:
              f.write("# Workflows index\n\n")
              for w in items:
                  f.write(f"## {w['name']} ({w['file']})\n")
                  f.write(f"- Triggers: `{w['on']}`\n")
                  f.write(f"- Jobs: {', '.join(w['jobs']) if w['jobs'] else '-'}\n\n")
          PY

      - name: Scan repo -> plugin/mu meta + hooks/symbols/includes
        shell: bash
        run: |
          set -euo pipefail
          python - << 'PY'
          import os, re, json
          from pathlib import Path

          RUN_ID = os.environ["RUN_ID"]
          OUT = Path(os.environ["OUT"])
          AUX = Path(f"_out/repo_audit/{RUN_ID}")
          OUT.mkdir(parents=True, exist_ok=True)

          root = Path(".")

          def walk_php(paths):
              for base in paths:
                  p = Path(base)
                  if not p.exists():
                      continue
                  for f in p.rglob("*.php"):
                      s = str(f)
                      if "/vendor/" in s or "/node_modules/" in s:
                          continue
                      yield f

          header_line = re.compile(r"^\s*([A-Za-z][A-Za-z \-]+):\s*(.+)\s*$")
          def parse_headers(php_file):
              headers = {}
              try:
                  with open(php_file, "r", encoding="utf-8", errors="ignore") as f:
                      for i,ln in zip(range(80), f):
                          m = header_line.match(ln)
                          if m:
                              headers[m.group(1).strip()] = m.group(2).strip()
              except Exception:
                  pass
              return headers

          def plugin_record(path, headers, kind):
              return {
                  "kind": kind,
                  "path": str(path),
                  "name": headers.get("Plugin Name") or path.parent.name,
                  "plugin_uri": headers.get("Plugin URI"),
                  "description": headers.get("Description"),
                  "version": headers.get("Version"),
                  "author": headers.get("Author"),
                  "author_uri": headers.get("Author URI"),
                  "text_domain": headers.get("Text Domain"),
                  "domain_path": headers.get("Domain Path"),
                  "requires_wp": headers.get("Requires at least"),
                  "tested_wp": headers.get("Tested up to"),
                  "requires_php": headers.get("Requires PHP"),
                  "network": headers.get("Network"),
              }

          # plugins (regular)
          plugin_meta = []
          pdir = Path("wp-content/plugins")
          if pdir.exists():
              for entry in sorted(pdir.iterdir()):
                  if entry.is_dir():
                      found = None
                      for f in entry.glob("*.php"):
                          h = parse_headers(f)
                          if "Plugin Name" in h:
                              plugin_meta.append(plugin_record(f,h,"plugin")); found=True; break
                      if not found:
                          for f in entry.rglob("*.php"):
                              h = parse_headers(f)
                              if "Plugin Name" in h:
                                  plugin_meta.append(plugin_record(f,h,"plugin")); break
                  elif entry.is_file() and entry.suffix==".php":
                      h = parse_headers(entry)
                      if "Plugin Name" in h:
                          plugin_meta.append(plugin_record(entry,h,"plugin"))

          # mu-plugins
          mu_meta = []
          mdir = Path("wp-content/mu-plugins")
          if mdir.exists():
              for f in sorted(mdir.rglob("*.php")):
                  h = parse_headers(f)
                  mu_meta.append(plugin_record(f,h,"mu"))

          # hooks / symbols / includes
          hook_calls = []
          sym_index = {"functions": [], "classes": []}
          includes = []

          re_add_action  = re.compile(r"\badd_action\s*\(\s*['\"]([^'\"]+)['\"]", re.I)
          re_add_filter  = re.compile(r"\badd_filter\s*\(\s*['\"]([^'\"]+)['\"]", re.I)
          re_do_action   = re.compile(r"\bdo_action\s*\(\s*['\"]([^'\"]+)['\"]", re.I)
          re_apply_filt  = re.compile(r"\bapply_filters\s*\(\s*['\"]([^'\"]+)['\"]", re.I)
          re_func        = re.compile(r"\bfunction\s+([a-zA-Z0-9_]+)\s*\(", re.I)
          re_class       = re.compile(r"\bclass\s+([a-zA-Z0-9_]+)\b", re.I)
          re_inc         = re.compile(r"\b(require|require_once|include|include_once)\s*\(\s*['\"]([^'\"]+)['\"]\s*\)", re.I)

          scan_paths = ["wp-content/plugins","wp-content/mu-plugins","wp-content/themes",".wtp","inc","includes"]
          for php in walk_php(scan_paths):
              try:
                  src = php.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue

              for m in re_add_action.finditer(src):
                  hook_calls.append({"type":"add_action","hook":m.group(1),"file":str(php)})
              for m in re_add_filter.finditer(src):
                  hook_calls.append({"type":"add_filter","hook":m.group(1),"file":str(php)})
              for m in re_do_action.finditer(src):
                  hook_calls.append({"type":"do_action","hook":m.group(1),"file":str(php)})
              for m in re_apply_filt.finditer(src):
                  hook_calls.append({"type":"apply_filters","hook":m.group(1),"file":str(php)})

              for m in re_func.finditer(src):
                  sym_index["functions"].append({"name":m.group(1),"file":str(php)})
              for m in re_class.finditer(src):
                  sym_index["classes"].append({"name":m.group(1),"file":str(php)})

              for m in re_inc.finditer(src):
                  includes.append({"type":m.group(1),"target":m.group(2),"file":str(php)})

          # zapisy
          (OUT/"plugin_meta.json").write_text(json.dumps(plugin_meta, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT/"mu_meta.json").write_text(json.dumps(mu_meta, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT/"hooks.json").write_text(json.dumps(hook_calls, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT/"symbol_index.json").write_text(json.dumps(sym_index, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT/"includes_index.json").write_text(json.dumps(includes, ensure_ascii=False, indent=2), encoding="utf-8")

          repo_audit = {
            "run_id": RUN_ID,
            "counts": {
              "plugins": len(plugin_meta),
              "mu_plugins": len(mu_meta),
              "hooks": len(hook_calls),
              "functions": len(sym_index["functions"]),
              "classes": len(sym_index["classes"]),
              "includes": len(includes)
            }
          }
          (OUT/"repo-audit.json").write_text(json.dumps(repo_audit, ensure_ascii=False, indent=2), encoding="utf-8")

          # ---------- Dependencies enrichment ----------
          def bucket_for(path):
              s = str(path)
              for prefix in ["wp-content/plugins/","wp-content/mu-plugins/","wp-content/themes/"]:
                  i = s.find(prefix)
                  if i >= 0:
                      rest = s[i+len(prefix):]
                      top = rest.split("/",1)[0]
                      label = prefix.rstrip("/").split("/")[-1]  # plugins | mu-plugins | themes
                      return f"{label}:{top}"
              return "other"

          edges = {}
          with open(OUT/"includes_index.json","r",encoding="utf-8") as f:
              includes = json.load(f)

          for inc in includes:
              src_file = inc["file"]
              trg      = inc["target"]
              src_b = bucket_for(src_file)
              if "wp-content/plugins/" in trg:
                  dst = "plugins:" + trg.split("wp-content/plugins/")[1].split("/",1)[0]
              elif "wp-content/mu-plugins/" in trg:
                  dst = "mu-plugins:" + trg.split("wp-content/mu-plugins/")[1].split("/",1)[0]
              elif "wp-content/themes/" in trg:
                  dst = "themes:" + trg.split("wp-content/themes/")[1].split("/",1)[0]
              else:
                  dst = src_b
              if src_b != dst:
                  edges.setdefault(src_b, set()).add(dst)

          dep = {"nodes": sorted(set(list(edges.keys()) + [d for s in edges.values() for d in s])),
                 "edges": sorted([{"from":k,"to":v} for k,vs in edges.items() for v in vs],
                                 key=lambda x: (x["from"], x["to"]))}

          (OUT/"dependencies.json").write_text(json.dumps(dep, ensure_ascii=False, indent=2), encoding="utf-8")

          # Mermaid graph
          lines = ["flowchart LR"]
          for n in dep["nodes"]:
              safe = n.replace("-", "_").replace(":", "_")
              lines.append(f'  {safe}["{n}"]')
          for e in dep["edges"]:
              a = e["from"].replace("-", "_").replace(":", "_")
              b = e["to"].replace("-", "_").replace(":", "_")
              lines.append(f"  {a} --> {b}")
          (OUT/"dependencies.mmd").write_text("\n".join(lines)+"\n", encoding="utf-8")

          # REPO_AUDIT.md (krótka karta)
          md = []
          md.append("# REPO AUDIT (full)")
          md.append(f"- Run ID: {RUN_ID}")
          md.append("")
          md.append("## Totals")
          for k,v in repo_audit["counts"].items():
              md.append(f"- {k}: **{v}**")
          md.append("")
          md.append("## Dependencies")
          md.append(f"- nodes: **{len(dep['nodes'])}**, edges: **{len(dep['edges'])}**")
          md.append("")
          md.append("```mermaid")
          md.extend(lines)
          md.append("```")
          (OUT/"REPO_AUDIT.md").write_text("\n".join(md)+"\n", encoding="utf-8")
          PY

      # --- NORMALIZACJA ŚCIEŻEK: themes/... -> wp-content/themes/... (hooks + symbols) ---
      - name: Normalize file paths in hooks/symbol_index
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          hooks="${OUT}/hooks.json"
          symbols="${OUT}/symbol_index.json"

          if [ -s "$hooks" ]; then
            jq 'map( if (.file|startswith("themes/")) then .file = ("wp-content/" + .file) else . end )' "$hooks" > "${hooks}.norm" && mv "${hooks}.norm" "$hooks"
          fi

          if [ -s "$symbols" ]; then
            jq '{
                  functions: ( .functions // [] | map( if (.file|startswith("themes/")) then .file = ("wp-content/" + .file) else . end ) ),
                  classes:   ( .classes   // [] | map( if (.file|startswith("themes/")) then .file = ("wp-content/" + .file) else . end ) )
                }' "$symbols" > "${symbols}.norm" && mv "${symbols}.norm" "$symbols"
          fi

      # --- UZUPEŁNIENIE plugin_meta.json z plugins-bundle_*.json (jeśli istnieją) ---
      - name: Enrich plugin_meta from plugins-bundle_*.json
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          out="${OUT}/plugin_meta.json"
          tmp="$(mktemp)"
          echo '[]' > "$tmp"
          shopt -s nullglob
          found=0
          for f in plugins-bundle_*.json; do
            [ -f "$f" ] || continue
            found=1
            jq -c '.[]? | {slug:(.slug // .text_domain // .name // .id // ""), version, name, source: (input_filename)}' "$f" >> "${tmp}.rows" || true
          done

          if [ "$found" -eq 1 ] && [ -s "${tmp}.rows" ]; then
            jq -s '[ .[] | fromjson? | select(.slug != null and .slug != "") ] | unique_by(.slug)' "${tmp}.rows" > "${out}.bundle" || echo '[]' > "${out}.bundle"
            if [ -s "$out" ]; then
              jq -s '
                def u(xs): xs | unique_by(.slug);
                (.[0] // []) as $a |
                (.[1] // []) as $b |
                u($a + [ .[] for . in $b | select( (.slug as $s | ($a | map(.slug) | index($s)) | not) ) ])
              ' "$out" "${out}.bundle" > "${out}.merged" || cp -f "${out}.bundle" "${out}.merged"
              mv "${out}.merged" "$out"
              rm -f "${out}.bundle"
            else
              mv "${out}.bundle" "$out"
            fi
          fi

      - name: Validate outputs (non-empty + basic schema)
        shell: bash
        run: |
          set -euo pipefail
          base="${OUT}"
          for f in REPO_AUDIT.md repo-audit.json plugin_meta.json mu_meta.json hooks.json symbol_index.json includes_index.json dependencies.json dependencies.mmd; do
            [ -s "${base}/${f}" ] || { echo "::error::Missing or empty ${f}"; exit 1; }
          done
          jq -e 'has("run_id") and has("counts")' "${base}/repo-audit.json" >/dev/null
          jq -e 'type=="array"' "${base}/plugin_meta.json" >/dev/null
          jq -e 'type=="array"' "${base}/mu_meta.json" >/dev/null
          jq -e 'type=="array"' "${base}/hooks.json" >/dev/null
          jq -e 'has("functions") and has("classes")' "${base}/symbol_index.json" >/dev/null
          jq -e 'type=="array"' "${base}/includes_index.json" >/dev/null
          jq -e 'has("nodes") and has("edges")' "${base}/dependencies.json" >/dev/null

      - name: Update latest (repo) safely via rsync (no tmp collisions)
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          run_dir="${OUT}"
          latest_dir="${LATEST}"
          tmp_dir="${latest_dir}.tmp"

          # usuń stare tmp jeśli zostało w repo
          if [ -e "${tmp_dir}" ]; then
            echo "::warning::Stale tmp '${tmp_dir}' exists; removing"
            rm -rf "${tmp_dir}" || true
          fi

          # zbuduj tmp i skopiuj wyniki runu
          mkdir -p "${tmp_dir}"
          cp -a "${run_dir}/." "${tmp_dir}/"

          # sanity-check przed publikacją
          for f in REPO_AUDIT.md repo-audit.json plugin_meta.json mu_meta.json hooks.json symbol_index.json includes_index.json dependencies.json dependencies.mmd; do
            test -s "${tmp_dir}/${f}" || { echo "::error::Missing ${f} in tmp"; exit 1; }
          done

          # jeśli latest nie istnieje -> szybki mv
          if [ ! -d "${latest_dir}" ]; then
            mv -f "${tmp_dir}" "${latest_dir}"
            echo "::notice::Latest did not exist; moved tmp -> latest"
            exit 0
          fi

          # jeśli latest istnieje -> mirroruj rsync --delete (bez kolizji)
          rsync -a --delete --delete-excluded "${tmp_dir}/" "${latest_dir}/"

          # kontrola po rsync
          for f in REPO_AUDIT.md repo-audit.json plugin_meta.json mu_meta.json hooks.json symbol_index.json includes_index.json dependencies.json dependencies.mmd; do
            test -s "${latest_dir}/${f}" || { echo "::error::After rsync ${f} missing"; exit 1; }
          done

          # posprzątaj tmp
          rm -rf "${tmp_dir}"
          echo "::notice::Latest repo updated via rsync and tmp cleaned up."

      - name: Commit & push (rebase-safe)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::Nothing to commit."
            exit 0
          fi
          git commit -m "repo audit (full + deps) ${RUN_ID}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git branch --show-current >/dev/null 2>&1 || git checkout -B "$BRANCH"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git pull --rebase origin "$BRANCH" || { git rebase --continue || true; }
            if git push origin "HEAD:$BRANCH"; then
              echo "::notice::Pushed (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Push failed after 3 attempts"
          exit 1
