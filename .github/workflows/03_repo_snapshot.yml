name: 03_repo_snapshot

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  repo-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (for simple processing)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build filelist + tree + workflows index
        run: |
          set -euo pipefail
          RUN_ID="${{ github.run_id }}"
          OUT_DIR=".wtp/state/ro/public/${RUN_ID}"
          LATEST_DIR=".wtp/state/ro/public/latest"
          mkdir -p "${OUT_DIR}"
          # create raw indexes
          git ls-files -co --exclude-standard > "${OUT_DIR}/filelist.txt" || true
          ls -laR > "${OUT_DIR}/tree.txt" || true

          python - <<'PY'
import glob, json, yaml, pathlib, os
rid=os.environ["RUN_ID"]
out=pathlib.Path(f".wtp/state/ro/public/{rid}")
items=[]
for p in sorted(glob.glob(".github/workflows/*.yml")):
    try:
        with open(p,"r",encoding="utf-8") as f:
            y=yaml.safe_load(f) or {}
    except Exception as e:
        y={"_parse_error": str(e)}
    items.append({
        "file": pathlib.Path(p).name,
        "name": y.get("name", pathlib.Path(p).name),
        "on": y.get("on"),
        "jobs": list((y.get("jobs") or {}).keys())
    })
out.mkdir(parents=True,exist_ok=True)
(out/"workflows.json").write_text(json.dumps(items,ensure_ascii=False,indent=2),encoding="utf-8")
md="# Workflows index\n\n"
for w in items:
    md+=f"## {w['name']} ({w['file']})\n- Triggers: `{w['on']}`\n- Jobs: {', '.join(w['jobs']) if w['jobs'] else '-'}\n\n"
(out/"workflows.md").write_text(md,encoding="utf-8")
PY

      - name: Mirror light indexes to latest
        run: |
          set -euo pipefail
          RUN_ID="${{ github.run_id }}"
          OUT_DIR=".wtp/state/ro/public/${RUN_ID}"
          LATEST_DIR=".wtp/state/ro/public/latest"
          mkdir -p "${LATEST_DIR}"
          for f in filelist.txt tree.txt workflows.json workflows.md; do
            if [ -f "${OUT_DIR}/${f}" ]; then
              cp -f "${OUT_DIR}/${f}" "${LATEST_DIR}/${f}"
            fi
          done

      - name: Commit & push indexes (safe)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .wtp/state/ro/public/${{ github.run_id }} || true
          git add .wtp/state/ro/public/latest || true
          if git diff --staged --quiet; then
            echo "::notice::Nothing to commit."
            exit 0
          fi
          git commit -m "repo snapshot ${GITHUB_RUN_ID}" || true
          git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
          git push origin HEAD:"${GITHUB_REF_NAME:-main}" || true
