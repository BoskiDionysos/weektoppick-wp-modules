name: 03_repo_snapshot

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RUN_ID: ${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Build repo-snapshot.json + REPO_ARCHITECTURE.md + REPO_AUDIT.md (to RUN dir only)
        shell: bash
        run: |
          set -euo pipefail
          python - << 'PY'
          import os, json
          from pathlib import Path
          from datetime import datetime

          RUN_ID = os.environ.get("RUN_ID","unknown")
          root = Path(".").resolve()

          # Katalogi/ścieżki do wykluczeń (prefiksy)
          EXCLUDE_PREFIXES = [
            ".git/",
            ".github/workflows._quarantine/",
            "_ci_logs/",
            ".wtp/state/ci_logs/",
            ".wtp/state/tmp/",
            ".wtp/snapshots/",
            ".wtp/state/ro/public/latest/wpcli/",
            ".wtp/state/ro/public/latest/debug-pack/",
            "node_modules/",
            "vendor/",
            ".idea/",
            ".vscode/",
          ]

          def excluded(rel_posix: str) -> bool:
            return any(rel_posix.startswith(p) for p in EXCLUDE_PREFIXES)

          def category_for(path: str) -> str:
            if path.startswith(".github/workflows/"):
              return "workflow-active"
            if path.startswith(".github/workflows._quarantine/"):
              return "workflow-quarantine"
            if path.startswith("wp-content/mu-plugins/"):
              return "mu-plugin"
            if path.startswith("wp-content/plugins/"):
              return "plugin"
            if path.startswith("wp-content/themes/"):
              return "theme"
            if path.startswith(".wtp/"):
              return "wtp-meta"
            return "other"

          files = []
          total_size = 0

          for p in root.rglob("*"):
            if p.is_dir():
              continue
            rel = p.relative_to(root).as_posix()
            if excluded(rel):
              continue
            try:
              st = p.stat()
              size = st.st_size
              mode = oct(st.st_mode & 0o777)
            except Exception:
              size = 0
              mode = None
            total_size += size
            files.append({
              "path": rel,
              "size": size,
              "mode": mode,
              "category": category_for(rel),
            })

          # Zliczenia per kategoria
          by_cat = {}
          for f in files:
            c = f["category"]
            e = by_cat.setdefault(c, {"count":0,"size":0})
            e["count"] += 1
            e["size"]  += f["size"]

          snapshot = {
            "run_id": RUN_ID,
            "run_ts": datetime.utcnow().isoformat(timespec="seconds") + "Z",
            "counts": {
              "files": len(files),
              "size": total_size,
              "by_category": by_cat,
            },
            "files": files,
          }

          out_run = Path(f".wtp/state/ro/public/{RUN_ID}/repo")
          out_run.mkdir(parents=True, exist_ok=True)

          # Zapis JSON (tylko do RUN dir)
          (out_run / "repo-snapshot.json").write_text(
            json.dumps(snapshot, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          # REPO_ARCHITECTURE.md
          def human(n):
            units = ["B","KB","MB","GB","TB","PB"]
            i = 0
            f = float(n)
            while f >= 1024 and i < len(units)-1:
              f /= 1024.0
              i += 1
            return f"{f:.1f} {units[i]}"

          top = {}
          for f in files:
            head = f["path"].split("/",1)[0]
            g = top.setdefault(head, {"count":0,"size":0,"sample":[]})
            g["count"] += 1
            g["size"]  += f["size"]
            if len(g["sample"]) < 10:
              g["sample"].append(f["path"])

          arch = []
          arch.append("# REPO_ARCHITECTURE")
          arch.append(f"- Run ID: {RUN_ID}")
          arch.append("")
          arch.append("## Top-level directories")
          arch.append("| Dir | Files | Size |")
          arch.append("|---|---:|---:|")
          for k in sorted(top.keys()):
            arch.append(f"| `{k}` | {top[k]['count']} | {human(top[k]['size'])} |")
          arch.append("")
          arch.append("## Samples by directory")
          for k in sorted(top.keys()):
            arch.append(f"### `{k}`  ({top[k]['count']} files, {human(top[k]['size'])})")
            for s in top[k]["sample"]:
              arch.append(f"- `{s}`")
            arch.append("")
          (out_run / "REPO_ARCHITECTURE.md").write_text("\n".join(arch)+"\n", encoding="utf-8")

          # REPO_AUDIT.md (zwięzłe)
          L=[]
          L.append("# REPO_AUDIT")
          L.append(f"- Run ID: {RUN_ID}")
          L.append(f"- Files total: {snapshot['counts']['files']}")
          L.append(f"- Size total: {human(snapshot['counts']['size'])}")
          L.append("")
          L.append("## By category")
          L.append("| Category | Files | Size |")
          L.append("|---|---:|---:|")
          for c, v in sorted(by_cat.items()):
            L.append(f"| {c} | {v['count']} | {human(v['size'])} |")
          L.append("")
          L.append("## Recommendations")
          L.append("- Keep tylko niezbędne workflows aktywne; resztę przenieś do `.github/workflows._quarantine/`.")
          L.append("- Nie commitować ciężkich dumpów – używaj GitHub Artifacts/Releases.")
          L.append("- Uważaj, by debug-packi nie trafiały do `latest/` (secret-scanning).")
          L.append("")
          (out_run / "REPO_AUDIT.md").write_text("\n".join(L)+"\n", encoding="utf-8")
          PY

      - name: Validate outputs (non-empty + schema)
        shell: bash
        run: |
          set -euo pipefail
          base=".wtp/state/ro/public/${RUN_ID}/repo"
          test -s "${base}/repo-snapshot.json"
          test -s "${base}/REPO_ARCHITECTURE.md"
          test -s "${base}/REPO_AUDIT.md"
          # Minimalna walidacja struktury JSON
          jq -e 'has("counts") and has("files") and (.files|type=="array") and (.counts|has("files"))' "${base}/repo-snapshot.json" >/dev/null

      - name: Atomically update latest (repo)
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          run_dir=".wtp/state/ro/public/${RUN_ID}/repo"
          latest_dir=".wtp/state/ro/public/latest/repo"
          tmp_dir="${latest_dir}.tmp"

          rm -rf "$tmp_dir"
          mkdir -p "$tmp_dir"
          cp -a "$run_dir"/. "$tmp_dir"/

          # sanity-check przed podmianą
          test -s "${tmp_dir}/repo-snapshot.json"
          test -s "${tmp_dir}/REPO_ARCHITECTURE.md"
          test -s "${tmp_dir}/REPO_AUDIT.md"

          mv -f "$tmp_dir" "$latest_dir"

      - name: Commit & push (rebase-safe)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::Nothing to commit."
            exit 0
          fi
          git commit -m "repo snapshot + architecture + audit ${{ env.RUN_ID }}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git branch --show-current >/dev/null 2>&1 || git checkout -B "$BRANCH"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git pull --rebase origin "$BRANCH" || { git rebase --continue || true; }
            if git push origin "HEAD:$BRANCH"; then
              echo "::notice::Pushed (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Push failed after 3 attempts"
          exit 1
